<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garmin Health</title>
<meta name="apple-mobile-web-app-title" content="Garmin Health">
<!-- Design systém převzatý z EdgePilot (Tradelog, design 2.0): tokeny v :root, Inter s tabulkovými číslicemi, boční panel na PC,
     spodní lišta na telefonu, KPI dlaždice, štítky. Motiv (břidlice / grafit) se nastaví před vykreslením, ať nebliká. -->
<script>try { if (localStorage.getItem('gh_theme') === 'graphite') document.documentElement.setAttribute('data-theme', 'graphite'); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" media="print" onload="this.media='all'">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg:#121A27; --bg2:#182233; --bg3:#1E2839; --bg4:#243045; --bg5:#2D3A50;
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.15); --grid:rgba(255,255,255,.07);
  --text:#EEF2F8; --text2:#A9B4C6; --text3:#8995AB;
  --green:#00C17D; --green-bg:rgba(0,193,125,.12);
  --red:#FF5A65; --red-bg:rgba(255,90,101,.12);
  --amber:#F2C94C; --amber-bg:rgba(242,201,76,.12);
  --crit:#FF7A1A; --crit-bg:rgba(255,122,26,.14);
  --blue:#4D9EFF; --blue-bg:rgba(77,158,255,.12); --blue-hi:#6AADFF;
  --purple:#9B7CF8; --purple-bg:rgba(155,124,248,.12);
  --teal:#2DD4BF; --ice:#E879F9; --teal-bg:rgba(45,212,191,.12);
  --on-fill:#FFFFFF; --ink:#0B0E14;
  --s-deep:#4C6FFF; --s-rem:#B07CF8; --s-light:#5EB8FF; --s-awake:#F2C94C;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --fs-kpi:26px; --fs-h1:20px; --fs-h2:15px; --fs-md:14px; --fs-sm:12px; --fs-xs:11px; --fs-lbl:11px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --r-sm:6px; --r-md:8px; --r-lg:12px;
  --hdr-h:52px; --sn-w:216px; --bnav-h:58px;
}
:root[data-theme="graphite"] { --bg:#1D1A16; --bg2:#25211C; --bg3:#2D2822; --bg4:#363029; --bg5:#413A32; --text:#F3EFE8; --text2:#BDB5A9; --text3:#A0968A; }
*{margin:0;padding:0;box-sizing:border-box;}
html{color-scheme:dark;-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--fs-md);line-height:1.5;min-height:100vh;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"lnum" 1;}
button{font:inherit;color:inherit;}
:where(input:not([type=checkbox]),select,textarea){background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:var(--r-sm);padding:6px 10px;font:inherit;font-size:var(--fs-md);outline:none;min-width:0;}
:where(input,select,textarea):focus-visible{border-color:var(--blue);}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
::selection{background:rgba(77,158,255,.3);}

/* ── hlavička ── */
.hdr{position:sticky;top:0;z-index:100;height:var(--hdr-h);display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-5);background:var(--bg2);border-bottom:1px solid var(--border);}
.logo{display:flex;align-items:center;gap:10px;min-width:0;}
.logo-mark{width:28px;height:28px;flex:none;border-radius:7px;background:linear-gradient(135deg,var(--teal),var(--blue));display:flex;align-items:center;justify-content:center;color:var(--on-fill);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.logo-mark svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.logo-text{font-weight:700;letter-spacing:-.2px;white-space:nowrap;}.logo-text span{font-weight:500;color:var(--blue);}
.hdr-sp{flex:1 1 auto;}
.chip-age{font-size:var(--fs-xs);color:var(--text3);white-space:nowrap;}
.chip-age.stale{color:var(--amber);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:6px 14px;border-radius:var(--r-md);border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:var(--fs-sm);font-weight:500;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap;}
.btn:hover{background:var(--bg4);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:var(--on-fill);}
.btn-primary:hover{background:var(--blue-hi);}
.btn:disabled{opacity:.6;cursor:wait;}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn.loading svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text2);}
.btn-ghost:hover{background:var(--bg3);color:var(--text);}

/* ── navigace: boční panel (≥ 1100 px), pás nahoře (761–1099 px), spodní lišta (≤ 760 px) ── */
#sidenav{display:none;}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 var(--sp-4);background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:var(--hdr-h);z-index:90;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:12px 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--text2);font-size:var(--fs-md);cursor:pointer;}
.tab svg,.sn-i svg,.bnav-i svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.tab.active{color:var(--text);border-bottom-color:var(--blue);}
.bnav{display:none;}
@media(min-width:1100px){
  .tabs{display:none;}
  #sidenav{display:flex;flex-direction:column;position:fixed;left:0;top:var(--hdr-h);bottom:0;width:var(--sn-w);background:var(--bg2);border-right:1px solid var(--border);padding:var(--sp-3) var(--sp-2);gap:2px;}
  main{margin-left:var(--sn-w);}
  .sn-gl{font-size:var(--fs-lbl);text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:600;padding:var(--sp-3) 10px var(--sp-1);}
  .sn-i{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:7px 10px;border:0;border-radius:var(--r-md);background:transparent;color:var(--text2);font-size:var(--fs-md);text-align:left;cursor:pointer;}
  .sn-i:hover{background:var(--bg3);color:var(--text);}
  .sn-i svg{color:var(--text3);}
  .sn-i.active{background:var(--blue-bg);color:var(--text);box-shadow:inset 3px 0 0 var(--blue);}
  .sn-i.active svg,.sn-i:hover svg{color:var(--blue);}
  .sn-foot{margin-top:auto;padding:var(--sp-3) 10px;font-size:var(--fs-xs);color:var(--text3);line-height:1.6;}
}
@media(max-width:760px){
  .tabs{display:none;}
  .hdr{padding:0 var(--sp-3);}
  .logo-text span{display:none;}
  body{padding-bottom:calc(var(--bnav-h) + env(safe-area-inset-bottom,0px));}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:300;height:calc(var(--bnav-h) + env(safe-area-inset-bottom,0px));padding:0 var(--sp-1) env(safe-area-inset-bottom,0px);background:var(--bg2);border-top:1px solid var(--border2);box-shadow:0 -6px 18px rgba(0,0,0,.35);}
  .bnav-i{flex:1 1 0;min-width:0;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--text3);font-size:var(--fs-xs);font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  .bnav-i svg{width:22px;height:22px;}
  .bnav-i.active{color:var(--blue);}
}

/* ── obsah ── */
main{padding:var(--sp-5);max-width:1400px;}
@media(min-width:1100px){main{max-width:calc(1400px + var(--sn-w));padding:var(--sp-5) var(--sp-6);}}
@media(max-width:760px){main{padding:var(--sp-4) var(--sp-3);}}
.page{display:none;}.page.active{display:block;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-4);}
.page-t{font-size:var(--fs-h1);font-weight:700;letter-spacing:-.01em;}
.page-s{font-size:var(--fs-sm);color:var(--text3);margin-top:2px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-4);min-width:0;}
.card+.card,.grid+.card,.card+.grid,.grid+.grid{margin-top:var(--sp-4);}
.grid>.card{margin-top:0;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-3);}
.card-t{font-size:var(--fs-h2);font-weight:600;}
.card-s{font-size:var(--fs-sm);color:var(--text3);}
.lbl{font-size:var(--fs-lbl);color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.muted{color:var(--text3);}.t2{color:var(--text2);}.sm{font-size:var(--fs-sm);}.xs{font-size:var(--fs-xs);}
.grid{display:grid;gap:var(--sp-4);}
.g-hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);}
.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr));}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media(max-width:1000px){.g-hero,.g-2{grid-template-columns:minmax(0,1fr);}}
@media(max-width:760px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3);}.card{padding:var(--sp-3);}}
a.lnk,button.lnk{color:var(--blue);background:none;border:0;cursor:pointer;font-size:var(--fs-sm);padding:0;text-decoration:none;}
a.lnk:hover,button.lnk:hover{text-decoration:underline;}

/* štítky stavu (I-129 EdgePilot): JEDNAT = plná oranžová, SLEDOVAT = žlutý obrys, OK = neutrální; zelená / červená jen lepší / horší */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:600;line-height:1.5;padding:1px 8px;border-radius:999px;border:1px solid var(--border2);white-space:nowrap;letter-spacing:.02em;}
.pill-crit{background:var(--crit);color:var(--ink);border-color:var(--crit);}
.pill-amber{color:var(--amber);border-color:var(--amber);}
.pill-ok{background:var(--bg4);color:var(--text2);}
.pill-good{background:var(--green-bg);color:var(--green);border-color:rgba(0,193,125,.3);}
.pill-bad{background:var(--red-bg);color:var(--red);border-color:rgba(255,90,101,.3);}
.pill-info{background:var(--blue-bg);color:var(--blue);border-color:rgba(77,158,255,.3);}

/* ── Dnes: připravenost ── */
.hero{display:flex;gap:var(--sp-5);align-items:center;}
.ring{position:relative;width:132px;height:132px;flex:none;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-n{font-size:36px;font-weight:700;line-height:1;letter-spacing:-.02em;}
.ring-u{font-size:var(--fs-xs);color:var(--text3);margin-top:4px;}
.hero-l{font-size:var(--fs-h2);font-weight:700;letter-spacing:.02em;}
.hero-d{color:var(--text2);margin-top:2px;}
.comp{display:grid;grid-template-columns:auto 1fr auto;gap:6px var(--sp-3);align-items:center;margin-top:var(--sp-3);font-size:var(--fs-sm);}
.bar{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:3px;}
@media(max-width:760px){.hero{gap:var(--sp-4);}.ring{width:104px;height:104px;}.ring-n{font-size:30px;}}
.alerts{display:flex;flex-direction:column;gap:var(--sp-2);}
.alert{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-3);border-radius:var(--r-md);background:var(--bg3);border-left:3px solid var(--border2);font-size:var(--fs-sm);}
.alert b{display:block;font-size:var(--fs-md);font-weight:600;}
.alert.a-crit{border-left-color:var(--crit);}.alert.a-warn{border-left-color:var(--amber);}.alert.a-ok{border-left-color:var(--green);}

/* KPI dlaždice (EdgePilot kpiTile): popisek → číslo → minigraf → kontext */
.brief+.grid{margin-top:var(--sp-4);}
.br{display:flex;gap:var(--sp-2);align-items:baseline;font-size:var(--fs-md);line-height:1.5;padding:3px 0;}
.br-i{font-size:var(--fs-xs);width:14px;flex:none;}.br-up .br-i{color:var(--green);}.br-down .br-i{color:var(--red);}.br-eq .br-i{color:var(--text3);}
.br-h{color:var(--text2);}
.nb{display:none;}.nb:not(:empty){display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--blue);color:var(--on-fill);font-size:var(--fs-xs);font-weight:600;margin-left:auto;}
.tab .nb:not(:empty){margin-left:6px;}.bnav-i{position:relative;}.bnav-i .nb:not(:empty){position:absolute;top:4px;left:calc(50% + 6px);margin:0;}
.iv{padding:var(--sp-3) 0;border-top:1px solid var(--grid);}.iv:first-of-type{border-top:0;padding-top:0;}
.iv-top{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;}.iv-id{font-size:var(--fs-xs);color:var(--text3);}.iv-t{font-size:var(--fs-md);}
.iv-co{margin-top:var(--sp-1);line-height:1.5;}.iv-jak{margin-top:var(--sp-1);line-height:1.5;}.iv-meta{margin-top:var(--sp-2);}.iv-pav{color:var(--amber);}
.iv-vote{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;margin-top:var(--sp-3);}.iv-b{min-height:40px;min-width:84px;}
.iv-b.on.iv-ano{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}.iv-b.on.iv-pozdeji{border-color:var(--amber);color:var(--amber);}.iv-b.on.iv-ne{background:var(--bg4);color:var(--text3);}
.iv-c textarea{width:100%;margin-top:var(--sp-2);}.iv-done{margin-top:var(--sp-2);font-size:var(--fs-sm);color:var(--text2);}
.iv-no summary{cursor:pointer;list-style:none;}.iv-no[open] summary{margin-bottom:var(--sp-3);}
.pods{margin-top:var(--sp-3);}.pod{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 0;border-top:1px solid var(--grid);}
@media(max-width:760px){.bnav-i span:not(.nb){font-size:10px;}.iv-b{flex:1;min-width:0;min-height:44px;}}
.g-nut{grid-template-columns:repeat(4,minmax(0,1fr));}.g-nut>.card{margin-top:0;}
.nbar{height:6px;border-radius:3px;background:var(--bg4);margin-top:var(--sp-2);overflow:hidden;}.nbar i{display:block;height:100%;background:var(--blue);border-radius:3px;}
.bal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-3);}.bal>div{display:flex;flex-direction:column;gap:2px;}.bal b{font-size:var(--fs-h2);font-weight:600;}
.ebar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:var(--sp-1);background:var(--bg4);}.ebar i{display:block;height:100%;}
.kgrow{display:flex;align-items:center;gap:var(--sp-3);}.kgrow input{width:110px;}
.fmeals{margin-top:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-3);}
.fmeal{border:1px solid var(--grid);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);}
.fmeal-h{display:grid;grid-template-columns:110px 92px minmax(0,1fr) auto auto;gap:var(--sp-2);align-items:center;}.fmeal-h select,.fmeal-h input{width:100%;}
.fit{display:grid;grid-template-columns:minmax(0,1fr) 72px auto 80px auto;gap:var(--sp-2);align-items:center;padding:4px 0;border-top:1px solid var(--grid);margin-top:4px;}.fit input{width:100%;text-align:right;}
.fit-k{font-size:var(--fs-sm);color:var(--text2);text-align:right;white-space:nowrap;}
#fquick .chip small{margin-left:4px;}
.fform{border:1px solid var(--border2);border-radius:var(--r-md);padding:var(--sp-3);margin-bottom:var(--sp-3);background:var(--bg3);}
.fform-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3);}.fform-g label{display:flex;flex-direction:column;gap:4px;}.fform-g input{width:100%;}
.fform-a{display:flex;gap:var(--sp-2);margin-top:var(--sp-3);}
.goals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3);}.goals label{display:flex;flex-direction:column;gap:4px;}.goals input{width:100%;}
.jsum{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-sm);}
.wk{margin-top:var(--sp-3);}
@media(max-width:1099px){.g-nut{grid-template-columns:repeat(2,minmax(0,1fr));}.fform-g,.goals{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:760px){.fmeal-h{grid-template-columns:minmax(0,1fr) 100px auto;}.fmeal-w{grid-column:1 / -1;order:4;}.fmeal-h .fit-k{display:none;}
  .fit{grid-template-columns:minmax(0,1fr) 64px 70px auto;}.fit .xs{display:none;}.fit input,.fmeal-h input,.fmeal-h select,.kgrow input,.fform input,.goals input{font-size:16px;}.bal b{font-size:var(--fs-md);}}
.adv{border-left:4px solid var(--green);}.adv-h{font-size:var(--fs-h2);font-weight:600;margin:2px 0 4px;}
.chart-sm{height:220px;}
.runs{display:flex;flex-direction:column;}
.run{border-top:1px solid var(--grid);padding:var(--sp-2) 0;cursor:pointer;}.run:first-child{border-top:0;}
.run-s{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,72px);gap:var(--sp-2);align-items:center;}
.run-n{display:flex;flex-direction:column;min-width:0;}.run-n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.run-v{display:flex;flex-direction:column;align-items:flex-end;}.run-v b{font-weight:600;}.run-v small{font-size:var(--fs-xs);color:var(--text3);}
.run-d{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2) var(--sp-4);margin-top:var(--sp-2);padding:var(--sp-2) var(--sp-3);background:var(--bg3);border-radius:var(--r-md);font-size:var(--fs-sm);}
.run.open .run-d{display:grid;}.run-d div{display:flex;flex-direction:column;gap:2px;}
@media(max-width:760px){.run-s{grid-template-columns:minmax(0,1fr) repeat(3,58px);}.run-s .run-v:nth-child(3){display:none;}.run-d{grid-template-columns:repeat(2,minmax(0,1fr));}.chart-sm{height:190px;}}
.gauges{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--sp-3);}
.gc{text-align:center;min-width:0;}.gc .lbl{margin-bottom:var(--sp-1);}
.gauge{display:block;width:100%;max-width:150px;height:auto;margin:0 auto;}
.gc-v{font-size:var(--fs-h2);font-weight:600;margin-top:-6px;}.gc-v small{font-size:var(--fs-xs);color:var(--text3);margin-left:2px;font-weight:500;}
.gc-a{display:flex;gap:var(--sp-2);justify-content:center;font-size:var(--fs-xs);min-height:16px;}
.g7{color:var(--blue);}.g14{color:var(--purple);}
@media(max-width:1099px){.gauges{grid-template-columns:repeat(3,minmax(0,1fr));}}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0;}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);}
.kpi-v{font-size:var(--fs-kpi);font-weight:600;line-height:1.2;letter-spacing:-.01em;}
.kpi-v small{font-size:var(--fs-sm);font-weight:500;color:var(--text3);margin-left:3px;}
.kpi-s{font-size:var(--fs-xs);color:var(--text3);line-height:1.45;}
.spark{width:100%;height:36px;display:block;margin-top:6px;}
@media(max-width:760px){.kpi-v{font-size:22px;}.kpi-top .pill{display:none;}}

/* ── segmentové přepínače a čipy ── */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-md);}
.seg button{border:0;background:none;color:var(--text2);padding:6px 12px;border-radius:var(--r-sm);font-size:var(--fs-sm);cursor:pointer;min-height:30px;}
.seg button.on{background:var(--bg5);color:var(--text);font-weight:600;}
.seg-scroll{display:flex;overflow-x:auto;scrollbar-width:none;max-width:100%;}
.seg-scroll::-webkit-scrollbar{display:none;}
.seg-scroll button{flex:none;}
#tsport{display:flex;flex-wrap:nowrap;}#tsport button{flex:1 1 auto;}@media(max-width:760px){#tsport button{min-height:44px;padding:6px 10px;}}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2);}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:var(--fs-sm);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.chip:hover{border-color:var(--border2);color:var(--text);}
.chip.on{background:var(--blue-bg);border-color:var(--blue);color:var(--text);}
.chip .cnt{display:inline-flex;align-items:center;gap:4px;}
.chip .cnt button{width:24px;height:24px;border-radius:50%;border:1px solid var(--border2);background:var(--bg4);cursor:pointer;line-height:1;font-size:var(--fs-md);}
.chip .cnt b{min-width:14px;text-align:center;}
.chip.auto{border-style:dashed;cursor:default;}
@media(max-width:760px){.chip{min-height:40px;}}

/* ── Trendy ── */
.chart-box{position:relative;height:340px;}
@media(max-width:760px){.chart-box{height:260px;}}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--sp-3);margin-top:var(--sp-4);}
.stat{background:var(--bg3);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);}
.stat b{display:block;font-size:var(--fs-h2);font-weight:600;}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));}}
.zones{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;font-size:var(--fs-sm);color:var(--text2);margin-top:var(--sp-3);}
.zones input{width:64px;text-align:center;}
.legend{display:flex;flex-wrap:wrap;gap:var(--sp-3);font-size:var(--fs-xs);color:var(--text2);}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}

/* ── Deník ── */
.daynav{display:flex;align-items:center;gap:var(--sp-2);}
.daynav .btn{min-width:38px;padding:6px 10px;}
.daynav-t{font-weight:600;min-width:150px;text-align:center;}
.grp+.grp{margin-top:var(--sp-4);}
.grp .lbl{margin-bottom:var(--sp-2);}
.meals{display:flex;flex-direction:column;gap:var(--sp-2);}
.meal{display:grid;grid-template-columns:110px 92px minmax(0,1fr) auto;gap:var(--sp-2);align-items:center;}
.meal select,.meal input{width:100%;}
.meal-w{grid-column:3;}
/* telefon: druh + čas + odebrat na prvním řádku, popis jídla přes celou šířku pod nimi (16 px = iOS nezvětšuje stránku při psaní) */
@media(max-width:760px){.meal{grid-template-columns:minmax(0,1fr) 110px auto;padding-bottom:var(--sp-2);border-bottom:1px solid var(--grid);}.meal-w{grid-column:1 / -1;order:4;}.meal input,.meal select,textarea{font-size:16px;}}
textarea{width:100%;min-height:72px;resize:vertical;}
.save-st{font-size:var(--fs-xs);color:var(--text3);}
.save-st.err{color:var(--crit);}

/* ── Vlivy ── */
.inf{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,2fr) auto;gap:var(--sp-2) var(--sp-3);align-items:center;padding:var(--sp-2) 0;border-bottom:1px solid var(--grid);}
.inf:last-child{border-bottom:0;}
.inf-n{font-weight:500;min-width:0;}
.inf-n small{display:block;font-size:var(--fs-xs);color:var(--text3);font-weight:400;}
.dbar{position:relative;height:18px;}
.dbar::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border2);}
.dbar>i{position:absolute;top:3px;height:12px;border-radius:3px;}
.inf-v{text-align:right;font-weight:600;white-space:nowrap;}
.inf-v small{display:block;font-weight:400;}
@media(max-width:760px){.inf{grid-template-columns:minmax(0,1fr) auto;}.inf .dbar{grid-column:1 / -1;order:3;}}

/* ── Nastavení ── */
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);}
th{font-size:var(--fs-lbl);text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:600;text-align:left;padding:var(--sp-2);border-bottom:1px solid var(--border);}
td{padding:var(--sp-2);border-bottom:1px solid var(--grid);vertical-align:middle;}
td input{width:76px;text-align:center;}
.tbl-wrap{overflow-x:auto;}
.list-ed{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;}
.list-ed .chip{cursor:default;}
.list-ed .chip button{border:0;background:none;color:var(--text3);cursor:pointer;font-size:var(--fs-md);line-height:1;}
.row-add{display:flex;gap:var(--sp-2);margin-top:var(--sp-3);flex-wrap:wrap;}
.row-add input{flex:1 1 180px;}

#note{display:none;margin-bottom:var(--sp-4);}
#note.on{display:flex;}
.empty{padding:var(--sp-5) var(--sp-3);text-align:center;color:var(--text2);}
.toast{position:fixed;left:50%;bottom:var(--sp-5);transform:translateX(-50%);background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm);z-index:400;opacity:0;pointer-events:none;transition:opacity .2s;}
.toast.on{opacity:1;}
@media(max-width:760px){.toast{bottom:calc(var(--bnav-h) + env(safe-area-inset-bottom,0px) + var(--sp-3));}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<header class="hdr">
  <div class="logo">
    <div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg></div>
    <div class="logo-text">Garmin <span>Health</span></div>
  </div>
  <div class="hdr-sp"></div>
  <span class="chip-age" id="age">—</span>
  <button class="btn btn-primary" id="syncBtn" title="Stáhnout nová data z Garminu"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg><span>Sync</span></button>
</header>
<nav class="tabs" id="tabs" aria-label="Sekce"></nav>
<nav id="sidenav" aria-label="Sekce"></nav>
<main>
  <div class="card" id="note" role="status"></div>
  <section class="page" id="p-dnes"></section>
  <section class="page" id="p-trendy"></section>
  <section class="page" id="p-denik"></section>
  <section class="page" id="p-jidlo"></section>
  <section class="page" id="p-beh"></section>
  <section class="page" id="p-vlivy"></section>
  <section class="page" id="p-inov"></section>
  <section class="page" id="p-nast"></section>
</main>
<nav class="bnav" id="bnav" aria-label="Sekce"></nav>
<div class="toast" id="toast"></div>
<script>
/* sestaveno tools/build.py ze src/inovace.js + src/app.js — needitovat zde */
// ══════════ INOVACE — backlog návrhů (píše Claude, hlasuje Pavel v záložce Inovace) ══════════
// Položka: id 'I-NNN', d = datum návrhu, t = název, co = co to přinese, jak = jak to bude fungovat,
// vypl = kolik vyplňování navíc (0 = žádné, 1 = jedno klepnutí denně, 2 = víc), zdroj + url = odkud nápad je (ověřené),
// st = 'navrh' | 'zavedeno' | 'zamitnuto', done = datum zavedení / uzavření, why = co přesně bylo uděláno (důkaz: commit / soubor),
// pavel = co musí Pavel udělat sám (např. vložit nový Apps Script), jinak prázdné.
// Hlasy a podněty Pavla jsou na Disku v garmin-settings.json → klíč garmin_ui → { inov: { 'I-001': { v: 'ano' | 'pozdeji' | 'ne', c, at } }, pod: [{ id, t, at }] }.
// Týdenní úloha Clauda: zavede schválené (v = 'ano'), doplní st / done / why, uzavře podněty v INOV_POD_DONE a přidá 2–3 nové návrhy. Nic se nemaže.
const INOV = [
  { id: 'I-001', d: '2026-10-30', t: 'Ranní pocit jedním klepnutím',
    co: 'Uvidíš, jestli se tvůj pocit shoduje s odhadem připravenosti, a Vlivy začnou počítat i s tím, jak se cítíš — ne jen s čísly z hodinek.',
    jak: 'Na stránce Dnes pět smajlíků (1 = mizerně … 5 = skvěle). Jedno klepnutí ráno, nic víc. V Trendech pocit vedle HRV, ve Vlivech jako další výsledek.',
    vypl: 1, zdroj: 'vlastní nápad', url: '', st: 'navrh' },
  { id: 'I-002', d: '2026-10-30', t: 'Stav regenerace podle trendu HRV',
    co: 'Místo jedné noci uvidíš, jak se tělo vyrovnává se zátěží za poslední týden: zvládáš / stabilní / riziko přetížení / nahromaděná únava.',
    jak: 'Z 7denního průměru HRV proti tvému normálnímu pásmu, kolísání HRV ze dne na den (CV) a klidové TF — stejný princip jako HRV4Training. Bez vyplňování.',
    vypl: 0, zdroj: 'HRV4Training — automatická detekce trendu', url: 'https://www.hrv4training.com/blog2/automatically-detected-physiological-trend-how-are-you-coping-with-your-training', st: 'navrh' },
  { id: 'I-003', d: '2026-10-30', t: 'Tvůj ideální čas usínání',
    co: 'Večer uvidíš okno, kdy jít spát, aby byl spánek nejlepší — odvozené z tvých vlastních nocí.',
    jak: 'Z nocí s nejlepším skóre spánku a nejnižší klidovou TF najde typický čas usínání (Oura potřebuje ~2 týdny pravidelných dat). Apps Script začne ukládat čas usnutí a probuzení.',
    vypl: 0, zdroj: 'Oura — Bedtime Guidance', url: 'https://support.ouraring.com/hc/en-us/articles/360025445154-Bedtime-Guidance', st: 'navrh', pavel: 'vložit nový Apps Script (pošlu)' },
  { id: 'I-004', d: '2026-10-30', t: 'Deník: „Jako včera“ a jen tvoje štítky',
    co: 'Méně klikání. Doplňky a běžné věci bývají denně stejné.',
    jak: 'Tlačítko „Jako včera“ zkopíruje štítky a doplňky z předchozího dne. Štítky, které nepoužíváš, se schovají pod „Další“. WHOOP doporučuje sledovat jen 5–10 věcí, které reálně zapisuješ, a vliv ukazuje už po 5 záznamech.',
    vypl: 0, zdroj: 'WHOOP Journal (the5krunner)', url: 'https://the5krunner.com/2023/04/15/whoop-new-recovery-behaviours/', st: 'navrh' },
  { id: 'I-005', d: '2026-10-30', t: 'Nedělní souhrn týdne e-mailem',
    co: 'Jednou týdně krátce do mailu: co se zlepšilo a zhoršilo, nejlepší a nejhorší noc, co ukázaly Vlivy. Nemusíš nic otevírat.',
    jak: 'Apps Script v neděli večer pošle e-mail se stejnými čísly jako karta Krátce + Vlivy. Bez vyplňování.',
    vypl: 0, zdroj: 'vlastní nápad', url: '', st: 'navrh', pavel: 'vložit nový Apps Script (pošlu)' },
  { id: 'I-006', d: '2026-10-30', t: 'Běh: doporučení na dnešek',
    co: 'Ráno jedna věta: volno / lehký běh / normální / můžeš přitlačit — podle regenerace i toho, kolik jsi naběhal.',
    jak: 'Spojí odhad připravenosti s tréninkovou zátěží posledních 7 dní proti průměru 4 týdnů (z aktivit Garminu). Krok k osobnímu trenérovi běhu.',
    vypl: 0, zdroj: 'vlastní nápad (cíl projektu: osobní trenér běhu); pásmo zátěže 0,8–1,3 (Gabbett 2016, The training—injury prevention paradox)', url: 'https://www.iat.uni-leipzig.de/datenbanken/iks/dfb/Record/4040728', st: 'zavedeno', done: '2026-10-30',
    why: 'Záložka Běh nahoře „Dnes“: runAdvice() v src/beh.js = odhad připravenosti + zátěž 7 dní vs Ø 28 dní (loadRatio)' },
];
// Vyřešené podněty Pavla: { id podnětu: { done: 'RRRR-MM-DD', why: 'co bylo uděláno' } }
const INOV_POD_DONE = {};

// ══════════ JÍDLO — databáze jídel, kalorie a makroživiny, váha (Pavel 30.10.2026) ══════════
// Databáze JR.food { id: { l, por g, porL, k kcal / 100 g, p bílkoviny, f tuky, c sacharidy (g / 100 g), src, at } } — hodnoty dohledává Claude
// (kaloricketabulky.cz / USDA, zdroj v src), Pavel je opravuje. Jídlo dne: day.m[].it [{ f: id, g: gramy }], váha day.kg, cíle JR.cfg.goal { k, p, f, c }.
const NUT = [['k', 'Kalorie', 'kcal', 0], ['p', 'Bílkoviny', 'g', 0], ['f', 'Tuky', 'g', 0], ['c', 'Sacharidy', 'g', 0]];
const MEAL_BY_H = h => h < 10 ? 'sn' : h < 15 ? 'ob' : h < 18 ? 'sv' : 've';
const nowHM = () => { const n = new Date(); return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); };
const foodOf = id => (JR.food || {})[id] || null;
const itemNut = it => { const f = foodOf(it.f); if (!f) return null; const q = (+it.g || 0) / 100; return { k: (f.k || 0) * q, p: (f.p || 0) * q, f: (f.f || 0) * q, c: (f.c || 0) * q }; };
// součty dne z položek databáze (null = ten den žádné položky — Vlivy ho pak nepočítají)
function nutDay(d) {
  const j = JR.days[d]; if (!j || !(j.m || []).some(m => (m.it || []).length)) return null;
  const s = { k: 0, p: 0, f: 0, c: 0, n: 0, late: 0, eveC: 0, unk: 0 };
  (j.m || []).forEach(m => (m.it || []).forEach(it => { const v = itemNut(it); if (!v) { s.unk++; return; } s.n++;
    ['k', 'p', 'f', 'c'].forEach(k => { s[k] += v[k]; });
    if ((m.h || '') >= '20:00') s.late += v.k;
    if (m.s === 've' || (m.h || '') >= '18:00') s.eveC += v.c; }));
  return s;
}
const goals = () => (JR.cfg && JR.cfg.goal) || {};
function foodUse(days) {
  const u = {}, from = addD(TODAY(), -(days || 120));
  Object.keys(JR.days).forEach(d => { if (d < from) return; (JR.days[d].m || []).forEach(m => (m.it || []).forEach(it => { u[it.f] = (u[it.f] || 0) + 1; })); });
  return u;
}
const kgOf = d => { const j = JR.days[d]; return j && j.kg != null ? +j.kg : null; };
function kgSeries(n) { const out = []; for (let i = n - 1; i >= 0; i--) { const d = addD(TODAY(), -i); out.push(kgOf(d)); } return out; }
function lastKg() { const ks = Object.keys(JR.days).filter(d => JR.days[d].kg != null).sort(); return ks.length ? { d: ks[ks.length - 1], kg: +JR.days[ks[ks.length - 1]].kg } : null; }
const kc = v => v == null ? '—' : fmt(Math.round(v));
const g1 = v => v == null ? '—' : fmt(Math.round(v));

async function foodSave(id, obj) {
  try {
    const r = CLOUD ? await gsRun('ghFoodSet', CLOUD.key, id, obj == null ? null : JSON.stringify(obj))
      : await (await fetch(`${API}/food`, { method: 'POST', body: JSON.stringify({ id: id, food: obj }), headers: { 'Content-Type': 'text/plain' } })).json();
    if (!r.ok) throw new Error(r.error || 'neznámá chyba');
    JR.food = JR.food || {}; if (obj == null) delete JR.food[id]; else JR.food[id] = r.food || Object.assign({}, obj);
    toast(obj == null ? 'Jídlo smazáno' : 'Jídlo uloženo'); return true;
  } catch (e) { toast('Neuloženo: ' + (e.message || e)); return false; }
}
const foodIdOf = l => String(l || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 40);

// ── souhrn pro Dnes a Deník (jeden řádek) ──
function nutLine(d) {
  const N = nutDay(d), G = goals(); if (!N) return '';
  return `<b>${kc(N.k)}</b>${G.k ? ' / ' + kc(G.k) : ''} kcal · B ${g1(N.p)} g · T ${g1(N.f)} g · S ${g1(N.c)} g`;
}

// ── záložka Jídlo ──
function renderJidlo() {
  const d = UI.jday || TODAY(), j = jEdit(d), N = nutDay(d), G = goals(), x = BYD[d] || {}, use = foodUse(120);
  const tgt = UI.fmeal || MEAL_BY_H(new Date().getHours());
  const top = Object.keys(JR.food || {}).sort((a, b) => (use[b] || 0) - (use[a] || 0) || (JR.food[a].l > JR.food[b].l ? 1 : -1)).slice(0, 12);
  const tiles = NUT.map(([k, l, u]) => { const v = N ? N[k] : null, gl = G[k] || null, pct = v != null && gl ? Math.min(100, v / gl * 100) : null;
    const over = k === 'k' && gl && v > gl * 1.1, low = k === 'p' && gl && v != null && d < TODAY() && v < gl * 0.8;
    return `<div class="card nt"><div class="kpi-top"><span class="lbl">${l}</span>${over ? pill('nad cílem', 'amber') : low ? pill('málo', 'amber') : ''}</div>
      <div class="kpi-v">${v == null ? '—' : fmt(Math.round(v))}<small>${u}</small></div><div class="kpi-s">${gl ? 'cíl ' + fmt(gl) + ' ' + u : 'cíl nenastaven'}</div>
      <div class="nbar"><i style="width:${pct == null ? 0 : pct}%"></i></div></div>`; }).join('');
  const burn = num(x.kc), bal = N && burn != null ? N.k - burn : null;
  const en = N ? [['B', N.p * 4, '--blue'], ['T', N.f * 9, '--purple'], ['S', N.c * 4, '--teal']] : [], enT = en.reduce((a, e) => a + e[1], 0) || 1;
  const meals = j.m.map((m, i) => mealBlock(m, i)).join('') || '<div class="muted sm">Zatím nic. Klepni na jídlo nahoře nebo „+ Jídlo“.</div>';
  const lk = lastKg(), ks = kgSeries(90), k7 = (() => { const v = kgSeries(7).filter(v => v != null); return v.length ? avg(v) : null; })();
  const k30 = (() => { const a = kgSeries(37).slice(0, 7).filter(v => v != null); return a.length && k7 != null ? k7 - avg(a) : null; })();
  $('p-jidlo').innerHTML = `
  <div class="page-head"><div><div class="page-t">Jídlo</div><div class="page-s">Kalorie a makroživiny z tvé databáze jídel. Nadiktuj Claudovi v chatu, co jsi jedl — doplní to sem.</div></div>
    <div class="daynav"><button class="btn" id="fprev" aria-label="Předchozí den">‹</button><div class="daynav-t">${esc(cap(dLong(d)))}</div>
    <button class="btn" id="fnext" aria-label="Další den" ${d >= TODAY() ? 'disabled' : ''}>›</button>${d !== TODAY() ? '<button class="btn btn-ghost" id="ftoday">Dnes</button>' : ''}</div></div>
  <div class="grid g-nut">${tiles}</div>
  <div class="grid g-2">
    <div class="card"><div class="card-h"><div class="card-t">Bilance s Garminem</div><span class="save-st" id="jst"></span></div>
      ${burn == null ? '<div class="muted sm">Spálené kalorie z hodinek pro tento den zatím nejsou (doplní se po syncu).</div>' : `<div class="bal">
        <div><span class="lbl">Snědeno</span><b>${N ? kc(N.k) : '—'}</b></div><div><span class="lbl">Spáleno (Garmin)</span><b>${kc(burn)}</b><small class="xs muted">aktivní ${kc(num(x.ka))}</small></div>
        <div><span class="lbl">${bal == null ? 'Rozdíl' : bal < 0 ? 'Deficit' : 'Přebytek'}</span><b>${bal == null ? '—' : fmt(Math.abs(Math.round(bal)))}</b></div></div>`}
      ${N ? `<div class="lbl" style="margin-top:var(--sp-3)">Energie z makroživin</div><div class="ebar">${en.map(e => `<i style="width:${(e[1] / enT * 100).toFixed(1)}%;background:${tok(e[2])}" title="${e[0]}"></i>`).join('')}</div>
        <div class="legend">${en.map(e => `<span><i style="background:${tok(e[2])}"></i>${e[0] === 'B' ? 'Bílkoviny' : e[0] === 'T' ? 'Tuky' : 'Sacharidy'} ${fmt(Math.round(e[1] / enT * 100))} %</span>`).join('')}</div>` : ''}
      ${N && N.unk ? `<div class="xs" style="color:var(--amber);margin-top:var(--sp-2)">${N.unk} položek odkazuje na jídlo, které v databázi už není.</div>` : ''}</div>
    <div class="card"><div class="card-h"><div class="card-t">Váha</div><span class="card-s">${lk ? 'poslední ' + esc(dShort(lk.d)) : 'zatím žádná'}</span></div>

}

// ── nastavení (prahy, zóny, vzhled): v paměti, localStorage = kopie, trvale na Disku (garmin-settings.json) ──
const ST = {};
function stGet(k) { if (k in ST) return ST[k]; try { return localStorage.getItem(k); } catch (e) { return null; } }
function stSet(k, v) { ST[k] = v; try { localStorage.setItem(k, v); } catch (e) {} stQueue(k, v); }
function stDel(k) { ST[k] = null; try { localStorage.removeItem(k); } catch (e) {} stQueue(k, null); }
let stPend = {}, stTimer = null;
function stQueue(k, v) { stPend[k] = v; clearTimeout(stTimer); stTimer = setTimeout(stFlush, 500); }
async function stFlush() {
  const b = stPend; stPend = {}; if (!Object.keys(b).length) return;
  try {
    const r = CLOUD ? await gsRun('ghSet', CLOUD.key, JSON.stringify(b))
      : await (await fetch(`${API}/settings`, { method: 'POST', body: JSON.stringify(b), headers: { 'Content-Type': 'text/plain' } })).json();
    if (!r.ok) throw new Error(r.error || 'neznámá chyba');
  } catch (e) { note('Nastavení se neuložilo na Disk (' + esc(e.message || e) + ') — platí jen v tomto prohlížeči.', 'warn'); }
}
function stApply(s) {
  if (!s || typeof s !== 'object') return;
  ST_KEYS.forEach(k => { if (k in s && s[k] != null) { ST[k] = String(s[k]); try { localStorage.setItem(k, ST[k]); } catch (e) {} } });
  T = loadT();
}
function gsRun(fn, ...a) {
  return new Promise((res, rej) => {
    if (!window.google || !google.script || !google.script.run) return rej(new Error('google.script.run není k dispozici'));
    google.script.run.withSuccessHandler(t => { try { res(typeof t === 'string' ? JSON.parse(t) : t); } catch (e) { rej(e); } })
      .withFailureHandler(e => rej(e instanceof Error ? e : new Error(String(e && e.message || e))))[fn](...a);
  });
}

// ══════════ DATA ══════════
async function fetchData() {
  if (CLOUD) return take(await gsRun('ghGet', CLOUD.key), 'cloud');
  const r = await fetch(`${API}/data`, { cache: 'no-store' });
  if (!r.ok) throw new Error('Lokální server: HTTP ' + r.status);
  try { const s = await fetch(`${API}/settings`, { cache: 'no-store' }); if (s.ok) { const st = await s.json(); migrateLocal(st); stApply(st); } } catch (e) {}
  let journal = null; try { const j = await (await fetch(`${API}/journal`, { cache: 'no-store' })).json(); if (j.ok) journal = j.journal; } catch (e) {}
  return take({ ok: true, data: await r.json(), journal: journal, at: new Date().toISOString(), ageH: 0 }, 'local');
}
// stará lokální verze měla prahy jen v localStorage prohlížeče → jednorázově na Disk
function migrateLocal(st) { ST_KEYS.forEach(k => { if (!(k in st)) { let v = null; try { v = localStorage.getItem(k); } catch (e) {} if (v != null) stQueue(k, v); } }); }
function take(r, src) {
  stApply(r.settings);
  if (r.journal) JR = { days: r.journal.days || {}, cfg: r.journal.cfg || {}, food: r.journal.food || {} };
  if (!r.ok || !r.data) throw new Error(r.error || 'Data se nepodařilo načíst');
  if (r.data.error) throw new Error(r.data.error);
  DATA = r.data;
  const se = r.sync && !r.sync.ok ? r.sync.error : (r.sync && r.sync.errs && r.sync.errs.length ? r.sync.errs.join(' · ') : null);
  META = { src: src, at: r.at || DATA.exported_at, ageH: r.ageH || 0, stale: !!r.stale, warn: se ? 'Sync z Garminu: ' + se : (DATA.warn || null), jerr: r.journalErr || null, ierr: r.inboxErr || null };
  buildDays();
  return DATA;
}
// jednotná tabulka dní: cloud dává `days`, lokální režim se skládá z nocí a HRV historie
function buildDays() {
  let rows = Array.isArray(DATA.days) && DATA.days.length ? DATA.days.map(x => ({ ...x, a: x.a || [] })) : null;
  if (!rows) {
    const m = {};
    (DATA.nights || []).forEach(n => { const d = n.date || n.calendar_date; if (!d) return; m[d] = { d: d, sc: num(n.score), sh: num(n.hours), rhr: num(n.hr), bb: num(n.bb), rs: num(n.resp), st: null, stp: null, hrv: num(n.hrv), a: [] }; });
    (DATA.hrv_history || []).forEach(h => { if (!h.date) return; (m[h.date] = m[h.date] || { d: h.date, a: [] }).hrv = num(h.hrv); });
    rows = Object.values(m);
  }
  const nm = {}; (DATA.nights || []).forEach(n => { nm[n.date || n.calendar_date] = n; });
  const hm_ = {}; (DATA.hrv_history || []).forEach(h => { hm_[h.date] = h; });
  rows.forEach(x => { const n = nm[x.d]; if (n) { x.deep = num(n.deep_min); x.rem = num(n.rem_min); x.light = num(n.light_min); x.awake = num(n.awake_min); if (x.rs == null) x.rsN = num(n.resp); else x.rsN = num(n.resp); }
    const h = hm_[x.d]; if (h) { x.bl = num(h.baseline_low); x.bu = num(h.baseline_upper); } });
  DAYS = rows.sort((a, b) => a.d < b.d ? -1 : 1); BYD = {}; DAYS.forEach(x => { BYD[x.d] = x; });
}

async function doSync() {
  const b = $('syncBtn'); b.disabled = true; b.classList.add('loading'); b.querySelector('span').textContent = 'Stahuji…';
  try {
    if (CLOUD) take(await gsRun('ghSync', CLOUD.key), 'cloud');
    else { await fetch(`${API}/sync`, { cache: 'no-store' }); await new Promise(r => setTimeout(r, 28000)); await fetchData(); }
    dataNote(); renderAll(); toast('Data z Garminu aktualizována');
  } catch (e) { note(esc(e.message || e), 'err'); }
  finally { b.disabled = false; b.classList.remove('loading'); b.querySelector('span').textContent = 'Sync'; }
}
function dataNote() {
  if (META && META.stale) note(`Data jsou stará ${Math.round(META.ageH)} h — sync z Garminu neprobíhá. Zkontroluj synchronizaci hodinek s telefonem a klíč Personal API (vyprší nejvýš za rok).`, 'warn');
  else if (META && META.warn) note(esc(META.warn), 'warn');
  else if (META && META.jerr) note('Deník se nepodařilo načíst: ' + esc(META.jerr), 'warn');
  else if (META && META.ierr) note('Záznam z chatu se nepodařilo převzít do deníku: ' + esc(META.ierr), 'warn');

}
function ageText() {
  if (!META) return '—';
  const t = new Date(META.at), s = t.toLocaleString('cs-CZ', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
  return (META.src === 'cloud' ? 'sync ' : 'načteno ') + s + (META.src === 'cloud' && META.ageH >= 1 ? ` · před ${Math.round(META.ageH)} h` : '');
}

// ══════════ PŘIPRAVENOST ══════════
// Garmin Personal API Training Readiness nevrací → odhad z dostupných složek (vážený průměr 0–100):
// HRV 35 % (poslední noc v pásmu baseline: dolní mez = 50, horní = 100), skóre spánku 30 %, Body Battery při probuzení 20 %,
// klidová TF 15 % (každý tep nad 7denním průměrem −10). Orientační — není to Garminův algoritmus.
const clamp100 = v => Math.max(0, Math.min(100, v));
function readinessOf() {
  const r = DATA.readiness || {};
  if (r.score != null) return { score: r.score, est: false, parts: [] };
  const h = DATA.hrv || {}, d = DATA.daily || {}, sl = DATA.sleep_latest || {}, parts = [];
  const hv = h.last_night_avg, lo = h.baseline_low, up = h.baseline_upper;
  if (hv != null && lo != null && up != null && up > lo) parts.push(['HRV', 35, clamp100(50 + 50 * (hv - lo) / (up - lo))]);
  if (sl.sleep_score_overall != null) parts.push(['Spánek', 30, clamp100(sl.sleep_score_overall)]);
  if (d.body_battery_at_wake != null) parts.push(['Body Battery', 20, clamp100(d.body_battery_at_wake)]);
  const rhr = d.resting_heart_rate ?? sl.resting_heart_rate, r7 = d.avg_resting_heart_rate_7day;
  if (rhr != null && r7 != null) parts.push(['Klidová TF', 15, clamp100(100 - 10 * (rhr - r7))]);
  if (!parts.length) return { score: null, est: true, parts };
  const w = parts.reduce((a, p) => a + p[1], 0);
  return { score: Math.round(parts.reduce((a, p) => a + p[1] * p[2], 0) / w), est: true, parts };
}
function alertsOf() {
  const h = DATA.hrv || {}, d = DATA.daily || {}, sl = DATA.sleep_latest || {}, al = [];
  const hrv = h.last_night_avg ?? sl.avg_overnight_hrv ?? 0, hr = d.resting_heart_rate ?? sl.resting_heart_rate ?? 0;
  const bb = d.body_battery_at_wake ?? d.body_battery_most_recent ?? 0, sc = sl.sleep_score_overall ?? 0;
  if (hrv > 0 && hrv < T.hrv_warn.val) al.push({ t: 'crit', h: `HRV kritická: ${hrv} ms`, b: 'Žádný trénink. Při příznacích kontaktovat lékaře.' });
  else if (hrv > 0 && hrv < T.hrv_ok.val) al.push({ t: 'warn', h: `HRV nízká: ${hrv} ms`, b: `Pod baselineem (${h.baseline_low ?? T.hrv_ok.val}–${h.baseline_upper ?? '—'} ms). Lehčí pohyb.` });
  else if (hrv > 0) al.push({ t: 'ok', h: `HRV v normálu: ${hrv} ms`, b: 'Nervový systém se dobře regeneruje.' });
  if (hr > T.hr_danger.val) al.push({ t: 'crit', h: `Klidová TF kritická: ${hr} bpm`, b: 'Lékař nebo hematolog.' });
  else if (hr > T.hr_warn.val) al.push({ t: 'warn', h: `Klidová TF zvýšená: ${hr} bpm`, b: 'Sledovat 2–3 dny.' });
  if (bb > 0 && bb < T.bb_warn.val) al.push({ t: 'warn', h: `Body Battery nízká: ${bb}`, b: 'Náročný trénink dnes nevhodný.' });
  if (sc > 0 && sc < T.sleep_warn.val) al.push({ t: 'warn', h: `Skóre spánku nízké: ${sc}`, b: 'Snížit intenzitu tréninku. Priorita: spánek a regenerace.' });
  return al;
}

// ══════════ VLIVY ══════════
// Faktor dne D (večer / během dne) → výsledek ráno D+1 (Garmin přiřazuje spánek a HRV k datu probuzení).
// Výsledek se porovnává s osobním průměrem předchozích 14 rán (min. 5 hodnot) — tím se odfiltruje dlouhodobý trend.
// Efekt = průměrná odchylka dnů S faktorem − dnů BEZ něj; Welchův t. Štítky deníku se hodnotí jen ve dnech, kdy je deník
// vyplněný (nevyplněný den ≠ „bez alkoholu“); údaje z Garminu (trénink, otužování, kroky, stres) platí pro všechny dny.
const OUT = {
  hrv: { l: 'HRV', u: 'ms', k: 'hrv', better: 1, d: 0 },
  sc:  { l: 'Skóre spánku', u: 'b.', k: 'sc', better: 1, d: 0 },
  rhr: { l: 'Klidová TF', u: 'bpm', k: 'rhr', better: -1, d: 1 },
  bb:  { l: 'Body Battery ráno', u: '', k: 'bb', better: 1, d: 0 },
};
const acts = d => (BYD[d] && BYD[d].a) || [];
const isTrain = a => (a.l || 0) >= 20;
function factors() {
  const J = d => jDay(d), tg = (d, id, min) => { const j = J(d); return j ? ((j.t && j.t[id] || 0) >= (min || 1) ? 1 : 0) : null; };
  const F = [];
  TAGS.forEach(g => g.items.forEach(t => F.push({ id: 't:' + t.id, l: t.l, g: g.g, src: 'deník', f: d => tg(d, t.id) })));

function spark(vals, col) {
  const v = vals.map(num), ok = v.filter(x => x != null); if (ok.length < 2) return '';

  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${col}"/></svg>`;
}
function ring(score, col) {

    + `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}"/></svg>`
    + `<div class="ring-v"><div class="ring-n">${score == null ? '—' : score}</div><div class="ring-u">ze 100</div></div></div>`;
}

function avgK(k, n) { const v = []; for (let i = 0; i < n; i++) { const x = BYD[addD(TODAY(), -i)]; if (x && num(x[k]) != null) v.push(num(x[k])); } return v.length ? avg(v) : null; }

function gauge(value, min, max, zones, unit, a7, a14) {
  const cx = 70, cy = 72, r = 54, sw = 12, P = v => Math.max(0, Math.min(1, (v - min) / (max - min)));
  const pt = (v, rad) => { const a = Math.PI * (1 - P(v)); return [cx + rad * Math.cos(a), cy - rad * Math.sin(a)]; };
  const arc = (v1, v2, col, w) => { if (v2 <= v1) return ''; const [x1, y1] = pt(v1, r), [x2, y2] = pt(v2, r);
    return `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0,1 ${x2.toFixed(1)},${y2.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w || sw}"/>`; };
  const tick = (v, col, ro, ri) => { if (v == null) return ''; const [x1, y1] = pt(v, ro), [x2, y2] = pt(v, ri);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`; };
  const nd = value == null || isNaN(value), bg = tok('--bg'), z = zones.filter(x => x.to > x.from);
  let s = arc(min, max, tok('--bg4'), sw) + z.map(x => arc(x.from, x.to, x.c)).join('');
  s += z.slice(1).map(x => { const [x1, y1] = pt(x.from, r - sw / 2 - 1), [x2, y2] = pt(x.from, r + sw / 2 + 1); return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${bg}" stroke-width="2"/>`; }).join('');
  s += tick(a14, tok('--purple'), r + sw / 2 + 9, r + sw / 2 + 2) + tick(a7, tok('--blue'), r + sw / 2 + 8, r + sw / 2 + 1);
  if (!nd) { const [nx, ny] = pt(value, r - 6); s += `<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${tok('--text')}" stroke-width="2.2" stroke-linecap="round"/>`; }
  s += `<circle cx="${cx}" cy="${cy}" r="5" fill="${tok('--bg3')}" stroke="${tok('--text2')}" stroke-width="2"/>`;
  return `<svg class="gauge" viewBox="0 0 140 80" role="img" aria-label="${nd ? 'bez dat' : esc(String(value)) + ' ' + esc(unit || '')}">${s}</svg>`;

// ── Krátce: co se zlepšuje / zhoršuje (tento týden vs minulý), série dní a vliv včerejška z deníku — jen z čísel, žádné domýšlení ──
const BRIEF_M = [
  { k: 'hrv', l: 'HRV', u: 'ms', b: 1, thr: 2, d: 0 }, { k: 'rhr', l: 'klidová TF', u: 'bpm', b: -1, thr: 1.5, d: 1 },

  { k: 'sh', l: 'délka spánku', u: 'h', b: 1, thr: 0.33, d: 1 }, { k: 'st', l: 'stres', u: '', b: -1, thr: 3, d: 0 },

function briefOf() {
  const ref = (DATA && DATA.date) || TODAY(), win = (k, from, n) => { const v = []; for (let i = from; i < from + n; i++) { const x = BYD[addD(ref, -i)]; if (x && num(x[k]) != null) v.push(num(x[k])); } return v; };
  const up = [], down = [], same = [];
  BRIEF_M.forEach(m => {
    const a = win(m.k, 0, 7), p = win(m.k, 7, 7); if (a.length < 4 || p.length < 4) return;
    const diff = avg(a) - avg(p), r = { m: m, now: avg(a), diff: diff };
    if (Math.abs(diff) < m.thr) same.push(r); else (diff * m.b > 0 ? up : down).push(r);
  });

  const item = r => `<b>${esc(r.m.l)}</b> ${esc(fv(r.now, r.m))} (${esc(fd(r.diff, r.m))})`;
  const out = [];
  if (up.length) out.push({ k: 'up', h: 'Zlepšuje se', t: up.slice(0, 3).map(item).join(', ') });
  if (down.length) out.push({ k: 'down', h: 'Zhoršuje se', t: down.slice(0, 3).map(item).join(', ') });
  if ((up.length || down.length) && same.length) out.push({ k: 'eq', h: 'Beze změny', t: same.map(r => esc(r.m.l)).join(', ') });
  if (!up.length && !down.length && same.length) out.push({ k: 'eq', h: 'Stabilní týden', t: 'Žádná z hlavních hodnot se proti minulému týdnu výrazně nezměnila.' });
  // série: HRV klesá / TF roste aspoň 3 rána po sobě
  const streak = (k, dir) => { let n = 0; for (let i = 0; i < 10; i++) { const a = BYD[addD(ref, -i)], b = BYD[addD(ref, -i - 1)]; if (!a || !b || num(a[k]) == null || num(b[k]) == null || (num(a[k]) - num(b[k])) * dir <= 0) break; n++; } return n; };
  const sH = streak('hrv', -1), sR = streak('rhr', 1), sHu = streak('hrv', 1);
  if (sH >= 3) out.push({ k: 'down', h: 'Série', t: `HRV klesá <b>${sH}. ráno po sobě</b> — zvaž lehčí den a víc spánku.` });
  else if (sR >= 3) out.push({ k: 'down', h: 'Série', t: `Klidová TF roste <b>${sR}. ráno po sobě</b> — může jít o únavu nebo nástup nemoci.` });
  else if (sHu >= 3) out.push({ k: 'up', h: 'Série', t: `HRV roste <b>${sHu}. ráno po sobě</b>.` });
  // včerejšek z deníku: faktory s průkazným vlivem na HRV, které včera platily

      const kv = dd.map(kgOf), roll = kv.map((_, i) => { const a = kv.slice(Math.max(0, i - 6), i + 1).filter(v => v != null); return a.length ? Math.round(avg(a) * 10) / 10 : null; });
      ds = [{ type: 'line', label: 'Váha (kg)', data: kv, borderColor: tok('--blue'), backgroundColor: tok('--blue'), pointRadius: 3, borderWidth: 1.4, spanGaps: true, tension: .2 },
        { type: 'line', label: 'Ø 7 d', data: roll, borderColor: tok('--text2'), borderDash: [5, 4], pointRadius: 0, borderWidth: 1.6, spanGaps: true, tension: .3 }];
      leg = `<span><i style="background:${tok('--blue')}"></i>Váha</span><span><i style="background:${tok('--text2')}"></i>Ø 7 dní</span>`;
    }
    CH = new Chart($('tch'), { data: { labels: lb, datasets: ds }, options: { ...base, scales: { x: { ...base.scales.x, stacked: m === 'makra' }, y: { ...base.scales.y, stacked: m === 'makra', beginAtZero: m !== 'kg' } } } });
    const logged = NU.filter(Boolean), kvs = dd.map(kgOf).filter(v => v != null), burn = dd.map((d, i) => NU[i] && BYD[d] && num(BYD[d].kc) != null ? NU[i].k - num(BYD[d].kc) : null).filter(v => v != null);
    $('tst').innerHTML = m === 'kg' ? stat('Poslední', kvs.length ? fmt(kvs[kvs.length - 1], 1) + ' kg' : '—') + stat('Min', kvs.length ? fmt(Math.min(...kvs), 1) : '—') + stat('Max', kvs.length ? fmt(Math.max(...kvs), 1) : '—') + stat('Změna za období', kvs.length > 1 ? sgn(kvs[kvs.length - 1] - kvs[0], 1) + ' kg' : '—') + stat('Vážení', fmt(kvs.length))
      : stat('Dny se zápisem', fmt(logged.length)) + stat('Ø kcal', kc(logged.length ? avg(logged.map(x => x.k)) : null)) + stat('Ø B / T / S', logged.length ? ['p', 'f', 'c'].map(k => fmt(Math.round(avg(logged.map(x => x[k]))))).join(' / ') + ' g' : '—') + stat('Ø bilance', burn.length ? sgn(Math.round(avg(burn)), 0) + ' kcal' : '—');
    // po týdnech (po–ne), nejnovější nahoře
    const wk = {}; dd.forEach((d, i) => { const dt = new Date(d + 'T12:00:00'), mo = addD(d, -((dt.getDay() + 6) % 7)); const w = wk[mo] = wk[mo] || { n: [], kg: [], b: [] };
      if (NU[i]) w.n.push(NU[i]); if (kgOf(d) != null) w.kg.push(kgOf(d)); if (NU[i] && BYD[d] && num(BYD[d].kc) != null) w.b.push(NU[i].k - num(BYD[d].kc)); });
    const wks = Object.keys(wk).sort().reverse().slice(0, 8).filter(k => wk[k].n.length || wk[k].kg.length);
    if (wks.length) $('twk').innerHTML = `<div class="lbl wk">Po týdnech (Ø ze dnů se zápisem)</div><div class="tbl-wrap"><table data-nogrid><thead><tr><th>Týden od</th><th>Dny</th><th>kcal</th><th>B</th><th>T</th><th>S</th><th>Bilance</th><th>Váha</th></tr></thead><tbody>`
      + wks.map(k => { const w = wk[k], a = f => w.n.length ? fmt(Math.round(avg(w.n.map(f)))) : '—';
        return `<tr><td>${esc(dShort(k))}</td><td>${w.n.length}</td><td>${a(x => x.k)}</td><td>${a(x => x.p)}</td><td>${a(x => x.f)}</td><td>${a(x => x.c)}</td><td>${w.b.length ? sgn(Math.round(avg(w.b)), 0) : '—'}</td><td>${w.kg.length ? fmt(avg(w.kg), 1) : '—'}</td></tr>`; }).join('') + '</tbody></table></div>';
  } else if (m === 'sleep') {
    title = 'Spánek — fáze a skóre';
    const H = k => rows.map(x => x[k] != null ? Math.round(x[k] / 6) / 10 : null);
    const ds = [['deep', 'Hluboký', '--s-deep'], ['rem', 'REM', '--s-rem'], ['light', 'Lehký', '--s-light'], ['awake', 'Bdění', '--s-awake']]
      .map(([k, l, c]) => ({ type: 'bar', label: l + ' (h)', data: H(k), backgroundColor: tok(c), stack: 's', yAxisID: 'y', borderRadius: 2 }));
    const hasStages = rows.some(x => x.deep != null);
    ds.push({ type: 'line', label: 'Skóre', data: rows.map(x => num(x.sc)), borderColor: tok('--text'), backgroundColor: tok('--text'), pointRadius: rows.length > 60 ? 0 : 2, borderWidth: 1.6, tension: .3, yAxisID: 'y2', spanGaps: true });
    if (!hasStages) ds.unshift({ type: 'bar', label: 'Spánek (h)', data: rows.map(x => num(x.sh)), backgroundColor: tok('--s-light'), yAxisID: 'y', borderRadius: 2 });
    CH = new Chart($('tch'), { data: { labels, datasets: hasStages ? ds : ds.filter(x => x.stack !== 's') }, options: { ...base, scales: { x: { ...base.scales.x, stacked: true }, y: { ...base.scales.y, stacked: true, title: { display: true, text: 'hodiny', color: t3, font } }, y2: { position: 'right', min: 0, max: 100, ticks: { color: t3, font }, grid: { display: false } } } } });
    leg = [['Hluboký', '--s-deep'], ['REM', '--s-rem'], ['Lehký', '--s-light'], ['Bdění', '--s-awake'], ['Skóre', '--text']].map(([l, c]) => `<span><i style="background:${tok(c)}"></i>${l}</span>`).join('');
    const sc = rows.map(x => num(x.sc)).filter(v => v != null), sh = rows.map(x => num(x.sh)).filter(v => v != null);
    const pct = k => { const a = rows.filter(x => x[k] != null && x.sh); return a.length ? avg(a.map(x => x[k] / 60 / x.sh * 100)) : null; };
    $('tst').innerHTML = stat('Ø skóre', fmt(avg(sc))) + stat('Ø délka', hm(avg(sh))) + stat('Hluboký', fmt(pct('deep')) + ' %') + stat('REM', fmt(pct('rem')) + ' %') + stat('Nocí', fmt(sc.length));
  } else {
    const L = { hrv: ['HRV — noční průměr', 'ms'], rhr: ['Klidová TF', 'bpm'], bb: ['Body Battery při probuzení', ''], resp: ['Dýchání', 'dech/min'], st: ['Průměrný stres dne', ''] }[m];
    title = L[0];
    const vals = rows.map(x => valOf(x, m)), win = z ? z.avgDays : 7;
    const roll = vals.map((_, i) => { const a = vals.slice(Math.max(0, i - win + 1), i + 1).filter(v => v != null); return a.length >= Math.min(3, win) ? Math.round(avg(a) * 10) / 10 : null; });
    const pc = vals.map(v => z ? zoneCol(m, v) : tok('--blue'));
    const ds = [{ type: 'line', label: L[0], data: vals, borderColor: tok('--blue'), pointBackgroundColor: pc, pointBorderColor: pc, pointRadius: rows.length > 90 ? 1.5 : 3, borderWidth: 1.4, tension: .25, spanGaps: true },
      { type: 'line', label: `Ø ${win} d`, data: roll, borderColor: tok('--text2'), borderDash: [5, 4], pointRadius: 0, borderWidth: 1.6, tension: .3, spanGaps: true }];
    if (m === 'hrv' && rows.some(x => x.bl != null)) {
      ds.push({ type: 'line', label: 'baseline dolní', data: rows.map(x => x.bl ?? null), borderColor: 'transparent', pointRadius: 0, spanGaps: true, fill: false });
      ds.push({ type: 'line', label: 'baseline horní', data: rows.map(x => x.bu ?? null), borderColor: 'transparent', backgroundColor: tok('--green-bg'), pointRadius: 0, spanGaps: true, fill: '-1' });
    }
    CH = new Chart($('tch'), { data: { labels, datasets: ds }, options: { ...base, plugins: { ...base.plugins, tooltip: { ...base.plugins.tooltip, filter: it => !/baseline/.test(it.dataset.label) } } }, plugins: z ? [zoneBand(m)] : [] });
    leg = `<span><i style="background:${tok('--blue')}"></i>${esc(L[0])}</span><span><i style="background:${tok('--text2')}"></i>Ø ${win} d</span>` + (m === 'hrv' ? `<span><i style="background:${tok('--green-bg')};border:1px solid ${tok('--green')}"></i>baseline Garminu</span>` : '');
    const v = vals.filter(x => x != null), lastV = v.length ? v[v.length - 1] : null, a = avg(v);
    const prevRows = UI.range ? DAYS.filter(x => x.d < addD(TODAY(), -UI.range + 1) && x.d >= addD(TODAY(), -2 * UI.range + 1)).map(x => valOf(x, m)).filter(x => x != null) : [];
    const ch = prevRows.length && a != null ? a - avg(prevRows) : null;
    $('tst').innerHTML = stat('Poslední', fmt(lastV, m === 'resp' ? 1 : 0) + ' ' + L[1]) + stat('Průměr', fmt(a, 1)) + stat('Min', fmt(v.length ? Math.min(...v) : null)) + stat('Max', fmt(v.length ? Math.max(...v) : null))
      + stat('Změna vs předchozí období', ch == null ? '—' : sgn(ch, 1));
  }
  $('ttl').textContent = title; $('tleg').innerHTML = leg;
}
function stat(l, v) { return `<div class="stat"><span class="lbl">${esc(l)}</span><b>${v}</b></div>`; }
// barevná pásma zón za grafem
function zoneBand(m) {
  return { id: 'zb', beforeDatasetsDraw(c) {
    const z = zones(m), y = c.scales.y, a = c.chartArea, ctx = c.ctx; if (!z || !y) return;
    const band = (lo, hi, col) => { const t = Math.max(a.top, y.getPixelForValue(hi)), b = Math.min(a.bottom, y.getPixelForValue(lo)); if (b > t) { ctx.fillStyle = col; ctx.fillRect(a.left, t, a.right - a.left, b - t); } };
    ctx.save(); ctx.globalAlpha = .07;
    if (z.up) { band(y.min, z.z1, tok('--red')); band(z.z1, z.z2, tok('--amber')); band(z.z2, y.max, tok('--green')); }
    else { band(y.min, z.z1, tok('--green')); band(z.z1, z.z2, tok('--amber')); band(z.z2, y.max, tok('--red')); }
    ctx.restore();
  } };
}

// ── Nastavení ──
// ── Inovace ──
const VOTES = { ano: 'Chci', pozdeji: 'Později', ne: 'Nechci' };
const inovVotes = () => uiGet().inov || {};
const inovOpen = () => { const v = inovVotes(); return INOV.filter(x => x.st === 'navrh' && !(v[x.id] && v[x.id].v)); };
function inovVote(id, val, c) {
  const u = uiGet(); u.inov = u.inov || {}; const cur = u.inov[id] || {};
  if (val !== undefined) cur.v = cur.v === val ? '' : val;
  if (c !== undefined) cur.c = String(c).slice(0, 300);
  cur.at = TODAY(); if (!cur.v && !cur.c) delete u.inov[id]; else u.inov[id] = cur;
  if (uiSet(u)) { renderInov(); navBadges(); }
}
function inovCard(x, v) {
  const my = v[x.id] || {}, ef = ['bez vyplňování', '1 klepnutí denně', 'víc vyplňování'][x.vypl || 0];
  const src = x.url ? `<a class="lnk" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.zdroj)}</a>` : `<span>${esc(x.zdroj || '')}</span>`;
  const done = x.st === 'zavedeno' ? `<div class="iv-done">Zavedeno ${esc(dShort(x.done || ''))}${x.why ? ' — ' + esc(x.why) : ''}</div>` : x.st === 'zamitnuto' && x.why ? `<div class="iv-why t2 sm">${esc(x.why)}</div>` : '';
  const vote = x.st === 'navrh' ? `<div class="iv-vote">${Object.entries(VOTES).map(([k, l]) => `<button class="btn iv-b${my.v === k ? ' on iv-' + k : ''}" data-vote="${k}" aria-pressed="${my.v === k}">${l}</button>`).join('')}
      <button class="lnk iv-cbtn" data-c="1">${my.c ? 'Upravit poznámku' : 'Poznámka'}</button></div>
      <div class="iv-c"${my.c ? '' : ' hidden'}><textarea rows="2" maxlength="300" placeholder="Jak to chceš jinak, co ti na tom vadí…">${esc(my.c || '')}</textarea></div>` : '';
  return `<div class="iv" data-id="${esc(x.id)}"><div class="iv-top"><span class="iv-id">${esc(x.id)}</span><b class="iv-t">${esc(x.t)}</b>${pill(ef, x.vypl ? 'amber' : 'info')}</div>
    <div class="iv-co">${esc(x.co)}</div><div class="iv-jak t2 sm">${esc(x.jak)}</div>
    <div class="iv-meta xs muted">Návrh ${esc(dShort(x.d))} · ${src}${x.pavel ? ' · <span class="iv-pav">potřebuje tebe: ' + esc(x.pavel) + '</span>' : ''}</div>${done}${vote}</div>`;
}
function renderInov() {
  const v = inovVotes(), u = uiGet(), pod = u.pod || [], open = inovOpen();
  const yes = INOV.filter(x => x.st === 'navrh' && v[x.id] && v[x.id].v === 'ano');
  const later = INOV.filter(x => x.st === 'navrh' && v[x.id] && v[x.id].v === 'pozdeji');
  const zav = INOV.filter(x => x.st === 'zavedeno').sort((a, b) => (b.done || '').localeCompare(a.done || ''));
  const no = INOV.filter(x => x.st === 'zamitnuto' || (x.st === 'navrh' && v[x.id] && v[x.id].v === 'ne'));
  const sec = (t, s, arr, emp) => `<div class="card"><div class="card-h"><div class="card-t">${t} <span class="muted">${arr.length || ''}</span></div><span class="card-s">${s}</span></div>`
    + (arr.length ? arr.map(x => inovCard(x, v)).join('') : `<div class="muted sm">${emp}</div>`) + '</div>';
  const podRows = pod.slice().reverse().map(p => { const dn = INOV_POD_DONE[p.id];
    return `<div class="pod"><div><div>${esc(p.t)}</div><div class="xs muted">${esc(dShort(p.at))}${dn ? ' · vyřešeno ' + esc(dShort(dn.done)) + ' — ' + esc(dn.why) : ' · čeká na Clauda'}</div></div>`
      + (dn ? pill('hotovo', 'info') : `<button class="btn btn-ghost" data-rmpod="${esc(p.id)}" aria-label="Smazat podnět">✕</button>`) + '</div>'; }).join('');
  $('p-inov').innerHTML = `
  <div class="page-head"><div><div class="page-t">Inovace</div><div class="page-s">Každý týden pár návrhů od Clauda — hlavně takové, které nechtějí víc vyplňování. Co označíš „Chci“, zavedu.</div></div></div>
  ${sec('K hlasování', 'nové návrhy', open, 'Vše odhlasováno — nové návrhy přijdou o víkendu.')}
  <div class="card"><div class="card-h"><div class="card-t">Tvůj podnět</div><span class="card-s">co tě napadne — vyřeším při týdenní kontrole</span></div>
    <div class="row-add"><input id="npod" maxlength="300" placeholder="např. chci vidět vliv tréninku na spánek"><button class="btn" id="apod">Přidat</button></div>
    ${podRows ? '<div class="pods">' + podRows + '</div>' : ''}</div>
  ${sec('Schváleno — zavedu', 'při nejbližší týdenní kontrole', yes, 'Zatím nic. Klepni „Chci“ u návrhu výše.')}
  ${later.length ? sec('Možná později', 'vrátím se k nim', later, '') : ''}
  ${sec('Zavedeno', 'co už v aplikaci je', zav, 'Zatím nic.')}
  ${no.length ? `<details class="card iv-no"><summary class="card-t">Nechci / zamítnuto <span class="muted">${no.length}</span></summary>${no.map(x => inovCard(x, v)).join('')}</details>` : ''}`;
  const P = $('p-inov');
  P.querySelectorAll('.iv').forEach(el => { const id = el.dataset.id;
    el.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => inovVote(id, b.dataset.vote));
    const cb = el.querySelector('[data-c]'), box = el.querySelector('.iv-c');
    if (cb && box) { cb.onclick = () => { box.hidden = false; box.querySelector('textarea').focus(); };
      box.querySelector('textarea').addEventListener('change', e => inovVote(id, undefined, e.target.value.trim())); } });
  const add = () => { const t = $('npod').value.trim(); if (!t) return; const u2 = uiGet(); u2.pod = u2.pod || [];
    if (u2.pod.length >= 40) { toast('Max. 40 podnětů — počkej, až je vyřeším'); return; }
    u2.pod.push({ id: 'P-' + Date.now().toString(36), t: t.slice(0, 300), at: TODAY() }); if (uiSet(u2)) { toast('Podnět uložen'); renderInov(); } };
  $('apod').onclick = add; $('npod').onkeydown = e => { if (e.key === 'Enter') add(); };
  P.querySelectorAll('[data-rmpod]').forEach(b => b.onclick = () => { const u2 = uiGet(); u2.pod = (u2.pod || []).filter(x => x.id !== b.dataset.rmpod); if (uiSet(u2)) renderInov(); });
}

function renderNast() {
  const sup = JR.cfg.sup || [], tags = JR.cfg.tags || [], theme = document.documentElement.getAttribute('data-theme') === 'graphite' ? 'graphite' : 'slate';
  $('p-nast').innerHTML = `
  <div class="page-head"><div><div class="page-t">Nastavení</div><div class="page-s">Ukládá se na Google Disk — platí na PC, iPadu i iPhonu.</div></div></div>
  <div class="grid g-2 inov-link">
    <div class="card"><div class="card-h"><div class="card-t">Vlivy</div><button class="lnk" data-go="vlivy">Otevřít →</button></div>
      <div class="sm t2">Co nejvíc mění tvé HRV, spánek, klidovou TF a Body Battery.</div></div>
    <div class="card"><div class="card-h"><div class="card-t">Inovace</div><button class="lnk" data-go="inov">Otevřít →</button></div>
      <div class="sm t2">${inovOpen().length ? inovOpen().length + ' návrhů čeká na tvůj hlas.' : 'Vše odhlasováno — nové návrhy přijdou v neděli.'}</div></div></div>
  <div class="grid g-2">
    <div class="card"><div class="card-h"><div class="card-t">Doplňky a léky</div><span class="card-s">zobrazí se v Deníku</span></div>
      <div class="list-ed" id="lsup">${sup.map(s => `<span class="chip">${esc(s.l)}<button data-rm="${esc(s.id)}" aria-label="Odebrat">✕</button></span>`).join('') || '<span class="muted sm">Zatím žádné.</span>'}</div>
      <div class="row-add"><input id="nsup" placeholder="např. Hořčík, D3, Omega-3" maxlength="40"><button class="btn" id="asup">Přidat</button></div></div>
    <div class="card"><div class="card-h"><div class="card-t">Vlastní štítky</div><span class="card-s">co chceš sledovat navíc</span></div>
      <div class="list-ed" id="ltag">${tags.map(s => `<span class="chip">${esc(s.l)}<button data-rm="${esc(s.id)}" aria-label="Odebrat">✕</button></span>`).join('') || '<span class="muted sm">Zatím žádné.</span>'}</div>
      <div class="row-add"><input id="ntag" placeholder="např. Masáž, Pozdní kofein z čaje" maxlength="40"><button class="btn" id="atag">Přidat</button></div></div>
  </div>
  <div class="card"><div class="card-h"><div class="card-t">Prahové hodnoty</div><button class="btn btn-ghost" id="treset">Obnovit výchozí</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Metrika</th><th>Práh</th><th>Stav</th><th>Akce</th></tr></thead><tbody>
    ${Object.entries(T).map(([k, r]) => `<tr><td>${esc(r.label)}</td><td><input type="number" step="any" data-th="${k}" value="${r.val}"> <span class="xs muted">${esc(r.unit)}</span></td>
      <td>${pill(r.badge, r.stav === 'ok' ? 'ok' : r.stav === 'warn' ? 'amber' : 'crit')}</td><td class="t2">${esc(r.akce)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="grid g-2">
    <div class="card"><div class="card-h"><div class="card-t">Vzhled</div></div>
      <div class="seg" id="theme"><button data-v="slate" class="${theme === 'slate' ? 'on' : ''}">Břidlice</button><button data-v="graphite" class="${theme === 'graphite' ? 'on' : ''}">Grafit</button></div></div>
    <div class="card"><div class="card-h"><div class="card-t">Data</div></div>
      <div class="sm t2">Zdroj: ${META.src === 'cloud' ? 'Garmin Personal API (Apps Script, ~každé 2 h)' : 'lokální server na PC'}<br>Poslední sync: ${esc(ageText())}<br>Dny v datech: ${DAYS.length} · deník: ${Object.keys(JR.days).length} dní</div>
      <div style="margin-top:var(--sp-3)"><button class="btn" id="nsync">Stáhnout teď</button></div></div>
  </div>`;
  const addTo = (key, inp) => { const l = $(inp).value.trim(); if (!l) return; const id = l.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 30) || ('x' + Date.now());
    const arr = JR.cfg[key] = JR.cfg[key] || []; if (!arr.some(x => x.id === id)) arr.push({ id: id, l: l.slice(0, 40) }); jCfgSave(); renderNast(); };
  $('asup').onclick = () => addTo('sup', 'nsup'); $('atag').onclick = () => addTo('tags', 'ntag');
  $('nsup').onkeydown = e => { if (e.key === 'Enter') addTo('sup', 'nsup'); }; $('ntag').onkeydown = e => { if (e.key === 'Enter') addTo('tags', 'ntag'); };
  [['lsup', 'sup'], ['ltag', 'tags']].forEach(([el, key]) => $(el).querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { JR.cfg[key] = (JR.cfg[key] || []).filter(x => x.id !== b.dataset.rm); jCfgSave(); renderNast(); }));
  $('p-nast').querySelectorAll('[data-th]').forEach(i => i.addEventListener('change', () => { const v = parseFloat(i.value); if (isNaN(v)) { i.value = T[i.dataset.th].val; return; } T[i.dataset.th].val = v; saveT(); toast('Práh uložen'); }));
  $('treset').onclick = () => { stDel('garmin_thresholds'); T = loadT(); renderNast(); toast('Výchozí prahy obnoveny'); };
  $('theme').querySelectorAll('button').forEach(b => b.onclick = () => themeSet(b.dataset.v));
  $('nsync').onclick = doSync;
  $('p-nast').querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}

// ══════════ START ══════════
(async function init() {
  navInit();
  $('syncBtn').addEventListener('click', doSync);
  const h = (location.hash || '').slice(1); go(NAV.some(n => n[0] === h) ? h : 'dnes');
  try { await fetchData(); dataNote(); renderAll(); }
  catch (e) {
    note(CLOUD ? esc(e.message || e) : '<b>Lokální server neběží.</b> Hlavní dashboard běží v cloudu (adresa z Apps Scriptu). Offline: dvojklik na <b>Start Garmin Dashboard</b> na ploše.', 'err');
    $('p-' + PAGE).innerHTML = '<div class="card empty">Data nejsou k dispozici.</div>';
  }
})();
