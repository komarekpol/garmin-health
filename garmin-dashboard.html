<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garmin Health</title>
<meta name="apple-mobile-web-app-title" content="Garmin Health">
<!-- Design systém převzatý z EdgePilot (Tradelog, design 2.0): tokeny v :root, Inter s tabulkovými číslicemi, boční panel na PC,
     spodní lišta na telefonu, KPI dlaždice, štítky. Motiv (břidlice / grafit) se nastaví před vykreslením, ať nebliká. -->
<script>try { if (localStorage.getItem('gh_theme') === 'graphite') document.documentElement.setAttribute('data-theme', 'graphite'); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" media="print" onload="this.media='all'">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg:#121A27; --bg2:#182233; --bg3:#1E2839; --bg4:#243045; --bg5:#2D3A50;
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.15); --grid:rgba(255,255,255,.07);
  --text:#EEF2F8; --text2:#A9B4C6; --text3:#8995AB;
  --green:#00C17D; --green-bg:rgba(0,193,125,.12);
  --red:#FF5A65; --red-bg:rgba(255,90,101,.12);
  --amber:#F2C94C; --amber-bg:rgba(242,201,76,.12);
  --crit:#FF7A1A; --crit-bg:rgba(255,122,26,.14);
  --blue:#4D9EFF; --blue-bg:rgba(77,158,255,.12); --blue-hi:#6AADFF;
  --purple:#9B7CF8; --purple-bg:rgba(155,124,248,.12);
  --teal:#2DD4BF; --ice:#E879F9; --teal-bg:rgba(45,212,191,.12);
  --on-fill:#FFFFFF; --ink:#0B0E14;
  --s-deep:#4C6FFF; --s-rem:#B07CF8; --s-light:#5EB8FF; --s-awake:#F2C94C;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --fs-kpi:26px; --fs-h1:20px; --fs-h2:15px; --fs-md:14px; --fs-sm:12px; --fs-xs:11px; --fs-lbl:11px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --r-sm:6px; --r-md:8px; --r-lg:12px;
  --hdr-h:52px; --sn-w:216px; --bnav-h:58px;
}
:root[data-theme="graphite"] { --bg:#1D1A16; --bg2:#25211C; --bg3:#2D2822; --bg4:#363029; --bg5:#413A32; --text:#F3EFE8; --text2:#BDB5A9; --text3:#A0968A; }
*{margin:0;padding:0;box-sizing:border-box;}
html{color-scheme:dark;-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--fs-md);line-height:1.5;min-height:100vh;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"lnum" 1;}
button{font:inherit;color:inherit;}
:where(input:not([type=checkbox]),select,textarea){background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:var(--r-sm);padding:6px 10px;font:inherit;font-size:var(--fs-md);outline:none;min-width:0;}
:where(input,select,textarea):focus-visible{border-color:var(--blue);}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
::selection{background:rgba(77,158,255,.3);}

/* ── hlavička ── */
.hdr{position:sticky;top:0;z-index:100;height:var(--hdr-h);display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-5);background:var(--bg2);border-bottom:1px solid var(--border);}
.logo{display:flex;align-items:center;gap:10px;min-width:0;}
.logo-mark{width:28px;height:28px;flex:none;border-radius:7px;background:linear-gradient(135deg,var(--teal),var(--blue));display:flex;align-items:center;justify-content:center;color:var(--on-fill);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
.logo-mark svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.logo-text{font-weight:700;letter-spacing:-.2px;white-space:nowrap;}.logo-text span{font-weight:500;color:var(--blue);}
.hdr-sp{flex:1 1 auto;}
.chip-age{font-size:var(--fs-xs);color:var(--text3);white-space:nowrap;}
.chip-age.stale{color:var(--amber);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:6px 14px;border-radius:var(--r-md);border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:var(--fs-sm);font-weight:500;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap;}
.btn:hover{background:var(--bg4);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:var(--on-fill);}
.btn-primary:hover{background:var(--blue-hi);}
.btn:disabled{opacity:.6;cursor:wait;}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn.loading svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text2);}
.btn-ghost:hover{background:var(--bg3);color:var(--text);}

/* ── navigace: boční panel (≥ 1100 px), pás nahoře (761–1099 px), spodní lišta (≤ 760 px) ── */
#sidenav{display:none;}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 var(--sp-4);background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:var(--hdr-h);z-index:90;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:12px 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--text2);font-size:var(--fs-md);cursor:pointer;}
.tab svg,.sn-i svg,.bnav-i svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.tab.active{color:var(--text);border-bottom-color:var(--blue);}
.bnav{display:none;}
@media(min-width:1100px){
  .tabs{display:none;}
  #sidenav{display:flex;flex-direction:column;position:fixed;left:0;top:var(--hdr-h);bottom:0;width:var(--sn-w);background:var(--bg2);border-right:1px solid var(--border);padding:var(--sp-3) var(--sp-2);gap:2px;}
  main{margin-left:var(--sn-w);}
  .sn-gl{font-size:var(--fs-lbl);text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:600;padding:var(--sp-3) 10px var(--sp-1);}
  .sn-i{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:7px 10px;border:0;border-radius:var(--r-md);background:transparent;color:var(--text2);font-size:var(--fs-md);text-align:left;cursor:pointer;}
  .sn-i:hover{background:var(--bg3);color:var(--text);}
  .sn-i svg{color:var(--text3);}
  .sn-i.active{background:var(--blue-bg);color:var(--text);box-shadow:inset 3px 0 0 var(--blue);}
  .sn-i.active svg,.sn-i:hover svg{color:var(--blue);}
  .sn-foot{margin-top:auto;padding:var(--sp-3) 10px;font-size:var(--fs-xs);color:var(--text3);line-height:1.6;}
}
@media(max-width:760px){
  .tabs{display:none;}
  .hdr{padding:0 var(--sp-3);}
  .logo-text span{display:none;}
  body{padding-bottom:calc(var(--bnav-h) + env(safe-area-inset-bottom,0px));}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:300;height:calc(var(--bnav-h) + env(safe-area-inset-bottom,0px));padding:0 var(--sp-1) env(safe-area-inset-bottom,0px);background:var(--bg2);border-top:1px solid var(--border2);box-shadow:0 -6px 18px rgba(0,0,0,.35);}
  .bnav-i{flex:1 1 0;min-width:0;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--text3);font-size:var(--fs-xs);font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  .bnav-i svg{width:22px;height:22px;}
  .bnav-i.active{color:var(--blue);}
}

/* ── obsah ── */
main{padding:var(--sp-5);max-width:1400px;}
@media(min-width:1100px){main{max-width:calc(1400px + var(--sn-w));padding:var(--sp-5) var(--sp-6);}}
@media(max-width:760px){main{padding:var(--sp-4) var(--sp-3);}}
.page{display:none;}.page.active{display:block;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-4);}
.page-t{font-size:var(--fs-h1);font-weight:700;letter-spacing:-.01em;}
.page-s{font-size:var(--fs-sm);color:var(--text3);margin-top:2px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-4);min-width:0;}
.card+.card,.grid+.card,.card+.grid,.grid+.grid{margin-top:var(--sp-4);}
.grid>.card{margin-top:0;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-3);}
.card-t{font-size:var(--fs-h2);font-weight:600;}
.card-s{font-size:var(--fs-sm);color:var(--text3);}
.lbl{font-size:var(--fs-lbl);color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.muted{color:var(--text3);}.t2{color:var(--text2);}.sm{font-size:var(--fs-sm);}.xs{font-size:var(--fs-xs);}
.grid{display:grid;gap:var(--sp-4);}
.g-hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);}
.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr));}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media(max-width:1000px){.g-hero,.g-2{grid-template-columns:minmax(0,1fr);}}
@media(max-width:760px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-3);}.card{padding:var(--sp-3);}}
a.lnk,button.lnk{color:var(--blue);background:none;border:0;cursor:pointer;font-size:var(--fs-sm);padding:0;text-decoration:none;}
a.lnk:hover,button.lnk:hover{text-decoration:underline;}

/* štítky stavu (I-129 EdgePilot): JEDNAT = plná oranžová, SLEDOVAT = žlutý obrys, OK = neutrální; zelená / červená jen lepší / horší */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:600;line-height:1.5;padding:1px 8px;border-radius:999px;border:1px solid var(--border2);white-space:nowrap;letter-spacing:.02em;}
.pill-crit{background:var(--crit);color:var(--ink);border-color:var(--crit);}
.pill-amber{color:var(--amber);border-color:var(--amber);}
.pill-ok{background:var(--bg4);color:var(--text2);}
.pill-good{background:var(--green-bg);color:var(--green);border-color:rgba(0,193,125,.3);}
.pill-bad{background:var(--red-bg);color:var(--red);border-color:rgba(255,90,101,.3);}
.pill-info{background:var(--blue-bg);color:var(--blue);border-color:rgba(77,158,255,.3);}

/* ── Dnes: připravenost ── */
.hero{display:flex;gap:var(--sp-5);align-items:center;}
.ring{position:relative;width:132px;height:132px;flex:none;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-n{font-size:36px;font-weight:700;line-height:1;letter-spacing:-.02em;}
.ring-u{font-size:var(--fs-xs);color:var(--text3);margin-top:4px;}
.hero-l{font-size:var(--fs-h2);font-weight:700;letter-spacing:.02em;}
.hero-d{color:var(--text2);margin-top:2px;}
.comp{display:grid;grid-template-columns:auto 1fr auto;gap:6px var(--sp-3);align-items:center;margin-top:var(--sp-3);font-size:var(--fs-sm);}
.bar{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:3px;}
@media(max-width:760px){.hero{gap:var(--sp-4);}.ring{width:104px;height:104px;}.ring-n{font-size:30px;}}
.alerts{display:flex;flex-direction:column;gap:var(--sp-2);}
.alert{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-3);border-radius:var(--r-md);background:var(--bg3);border-left:3px solid var(--border2);font-size:var(--fs-sm);}
.alert b{display:block;font-size:var(--fs-md);font-weight:600;}
.alert.a-crit{border-left-color:var(--crit);}.alert.a-warn{border-left-color:var(--amber);}.alert.a-ok{border-left-color:var(--green);}

/* KPI dlaždice (EdgePilot kpiTile): popisek → číslo → minigraf → kontext */
.brief+.grid{margin-top:var(--sp-4);}
.recov .stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:0;}
@media(max-width:760px){.recov .stats{grid-template-columns:repeat(2,minmax(0,1fr));}}
/* ranní pocit (I-001) */
.pc{margin-bottom:var(--sp-3);}
.pc-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--sp-2);margin-top:var(--sp-2);}
.pcb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;border:1px solid var(--border2);border-radius:var(--r-md);background:var(--bg3);color:var(--text2);cursor:pointer;padding:var(--sp-1);touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.pcb b{font-size:var(--fs-h2);color:var(--text);}.pcb span{font-size:var(--fs-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.pcb.on{background:var(--blue-bg);border-color:var(--blue);color:var(--text);}
.pc-cmp{margin-top:var(--sp-2);}
/* Deník: další štítky (I-004) */
details.more{margin-top:var(--sp-3);}details.more>summary{cursor:pointer;color:var(--text2);font-size:var(--fs-sm);min-height:32px;display:flex;align-items:center;}
.br{display:flex;gap:var(--sp-2);align-items:baseline;font-size:var(--fs-md);line-height:1.5;padding:3px 0;}
.br-i{font-size:var(--fs-xs);width:14px;flex:none;}.br-up .br-i{color:var(--green);}.br-down .br-i{color:var(--red);}.br-eq .br-i{color:var(--text3);}
.br-h{color:var(--text2);}
.nb{display:none;}.nb:not(:empty){display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--blue);color:var(--on-fill);font-size:var(--fs-xs);font-weight:600;margin-left:auto;}
.tab .nb:not(:empty){margin-left:6px;}.bnav-i{position:relative;}.bnav-i .nb:not(:empty){position:absolute;top:4px;left:calc(50% + 6px);margin:0;}
.iv{padding:var(--sp-3) 0;border-top:1px solid var(--grid);}.iv:first-of-type{border-top:0;padding-top:0;}
.iv-top{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;}.iv-id{font-size:var(--fs-xs);color:var(--text3);}.iv-t{font-size:var(--fs-md);}
.iv-co{margin-top:var(--sp-1);line-height:1.5;}.iv-jak{margin-top:var(--sp-1);line-height:1.5;}.iv-meta{margin-top:var(--sp-2);}.iv-pav{color:var(--amber);}
.iv-vote{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;margin-top:var(--sp-3);}.iv-b{min-height:40px;min-width:84px;}
.iv-b.on.iv-ano{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}.iv-b.on.iv-pozdeji{border-color:var(--amber);color:var(--amber);}.iv-b.on.iv-ne{background:var(--bg4);color:var(--text3);}
.iv-c textarea{width:100%;margin-top:var(--sp-2);}.iv-done{margin-top:var(--sp-2);font-size:var(--fs-sm);color:var(--text2);}
.iv-no summary{cursor:pointer;list-style:none;}.iv-no[open] summary{margin-bottom:var(--sp-3);}
.pods{margin-top:var(--sp-3);}.pod{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 0;border-top:1px solid var(--grid);}
@media(max-width:760px){.bnav-i span:not(.nb){font-size:10px;}.iv-b{flex:1;min-width:0;min-height:44px;}}
.g-nut{grid-template-columns:repeat(4,minmax(0,1fr));}.g-nut>.card{margin-top:0;}
.nbar{height:6px;border-radius:3px;background:var(--bg4);margin-top:var(--sp-2);overflow:hidden;}.nbar i{display:block;height:100%;background:var(--blue);border-radius:3px;}
.bal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-3);}.bal>div{display:flex;flex-direction:column;gap:2px;}.bal b{font-size:var(--fs-h2);font-weight:600;}
.ebar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:var(--sp-1);background:var(--bg4);}.ebar i{display:block;height:100%;}
.kgrow{display:flex;align-items:center;gap:var(--sp-3);}.kgrow input{width:110px;}
.fmeals{margin-top:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-3);}
.fmeal{border:1px solid var(--grid);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);}
.fmeal-h{display:grid;grid-template-columns:110px 92px minmax(0,1fr) auto auto;gap:var(--sp-2);align-items:center;}.fmeal-h select,.fmeal-h input{width:100%;}
.fmeal-ph .fmeal-h{display:flex;flex-wrap:wrap;}.fmeal-ph .fmeal-h .btn{margin-left:auto;}
.fit{display:grid;grid-template-columns:minmax(0,1fr) 72px auto 80px auto;gap:var(--sp-2);align-items:center;padding:4px 0;border-top:1px solid var(--grid);margin-top:4px;}.fit input{width:100%;text-align:right;}
.fit-k{font-size:var(--fs-sm);color:var(--text2);text-align:right;white-space:nowrap;}
#fquick .chip small{margin-left:4px;}
.fform{border:1px solid var(--border2);border-radius:var(--r-md);padding:var(--sp-3);margin-bottom:var(--sp-3);background:var(--bg3);}
.fform-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3);}.fform-g label{display:flex;flex-direction:column;gap:4px;}.fform-g input{width:100%;}
.fform-a{display:flex;gap:var(--sp-2);margin-top:var(--sp-3);}
.goals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3);}.goals label{display:flex;flex-direction:column;gap:4px;}.goals input{width:100%;}
.jsum{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-sm);}
.wk{margin-top:var(--sp-3);}
@media(max-width:1099px){.g-nut{grid-template-columns:repeat(2,minmax(0,1fr));}.fform-g,.goals{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:760px){.fmeal-h{grid-template-columns:minmax(0,1fr) 100px auto;}.fmeal-w{grid-column:1 / -1;order:4;}.fmeal-h .fit-k{display:none;}
  .fit{grid-template-columns:minmax(0,1fr) 64px 70px auto;}.fit .xs{display:none;}.fit input,.fmeal-h input,.fmeal-h select,.kgrow input,.fform input,.goals input{font-size:16px;}.bal b{font-size:var(--fs-md);}}
.adv{border-left:4px solid var(--green);}.adv-h{font-size:var(--fs-h2);font-weight:600;margin:2px 0 4px;}
.chart-sm{height:220px;}
.runs{display:flex;flex-direction:column;}
.run{border-top:1px solid var(--grid);padding:var(--sp-2) 0;cursor:pointer;}.run:first-child{border-top:0;}
.run-s{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,72px);gap:var(--sp-2);align-items:center;}
.run-n{display:flex;flex-direction:column;min-width:0;}.run-n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.run-v{display:flex;flex-direction:column;align-items:flex-end;}.run-v b{font-weight:600;}.run-v small{font-size:var(--fs-xs);color:var(--text3);}
.run-d{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2) var(--sp-4);margin-top:var(--sp-2);padding:var(--sp-2) var(--sp-3);background:var(--bg3);border-radius:var(--r-md);font-size:var(--fs-sm);}
.run.open .run-d{display:grid;}.run-d div{display:flex;flex-direction:column;gap:2px;}
@media(max-width:760px){.run-s{grid-template-columns:minmax(0,1fr) repeat(3,58px);}.run-s .run-v:nth-child(3){display:none;}.run-d{grid-template-columns:repeat(2,minmax(0,1fr));}.chart-sm{height:190px;}}
.gauges{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--sp-3);}
.gc{text-align:center;min-width:0;}.gc .lbl{margin-bottom:var(--sp-1);}
.gauge{display:block;width:100%;max-width:150px;height:auto;margin:0 auto;}

.kpi{display:flex;flex-direction:column;gap:2px;min-width:0;}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);}

.kpi-s{font-size:var(--fs-xs);color:var(--text3);line-height:1.45;}
.spark{width:100%;height:36px;display:block;margin-top:6px;}

.seg button.on{background:var(--bg5);color:var(--text);font-weight:600;}
.seg-scroll{display:flex;overflow-x:auto;scrollbar-width:none;max-width:100%;}
.seg-scroll::-webkit-scrollbar{display:none;}
.seg-scroll button{flex:none;}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:var(--fs-sm);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}

.chip .cnt{display:inline-flex;align-items:center;gap:4px;}

.chip .cnt b{min-width:14px;text-align:center;}
.chip.auto{border-style:dashed;cursor:default;}
@media(max-width:760px){.chip{min-height:40px;}}

/* ── Trendy ── */
.chart-box{position:relative;height:340px;}
@media(max-width:760px){.chart-box{height:260px;}}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--sp-3);margin-top:var(--sp-4);}
.stat{background:var(--bg3);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);}
.stat b{display:block;font-size:var(--fs-h2);font-weight:600;}

.zones{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;font-size:var(--fs-sm);color:var(--text2);margin-top:var(--sp-3);}

.legend{display:flex;flex-wrap:wrap;gap:var(--sp-3);font-size:var(--fs-xs);color:var(--text2);}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}

/* ── Deník ── */

.grp+.grp{margin-top:var(--sp-4);}
.grp .lbl{margin-bottom:var(--sp-2);}

.meal select,.meal input{width:100%;}
.meal-w{grid-column:3;}

textarea{width:100%;min-height:72px;resize:vertical;}
.save-st{font-size:var(--fs-xs);color:var(--text3);}
.save-st.err{color:var(--crit);}

/* ── Vlivy ── */
.inf{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,2fr) auto;gap:var(--sp-2) var(--sp-3);align-items:center;padding:var(--sp-2) 0;border-bottom:1px solid var(--grid);}
.inf:last-child{border-bottom:0;}
.inf-n{font-weight:500;min-width:0;}
.inf-n small{display:block;font-size:var(--fs-xs);color:var(--text3);font-weight:400;}
.dbar{position:relative;height:18px;}
.dbar::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border2);}
.dbar>i{position:absolute;top:3px;height:12px;border-radius:3px;}
.inf-v{text-align:right;font-weight:600;white-space:nowrap;}
.inf-v small{display:block;font-weight:400;}
@media(max-width:760px){.inf{grid-template-columns:minmax(0,1fr) auto;}.inf .dbar{grid-column:1 / -1;order:3;}}

/* ── Nastavení ── */
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);}
th{font-size:var(--fs-lbl);text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:600;text-align:left;padding:var(--sp-2);border-bottom:1px solid var(--border);}
td{padding:var(--sp-2);border-bottom:1px solid var(--grid);vertical-align:middle;}

.sup-row .x{border:0;background:none;color:var(--text3);cursor:pointer;font-size:var(--fs-md);min-width:44px;min-height:44px;}
.chip .reg{color:var(--text3);font-size:var(--fs-xs);}
.sup-row .sup-q,.sq-row .sup-q{flex:0 0 72px;}
.sq{margin-top:var(--sp-2);}.sq summary{cursor:pointer;min-height:44px;display:flex;align-items:center;}
.qday{display:flex;align-items:baseline;gap:var(--sp-2);margin:var(--sp-3) 0 var(--sp-2);font-size:var(--fs-sm)}
.qday:first-of-type{margin-top:0}
.sq-rows{display:flex;flex-direction:column;gap:var(--sp-2);}
.sq-row{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;min-height:44px;}
.sq-row .sup-n{flex:1 1 160px;font-size:var(--fs-md);}
.row-add{display:flex;gap:var(--sp-2);margin-top:var(--sp-3);flex-wrap:wrap;}
.row-add input{flex:1 1 180px;}

#note{display:none;margin-bottom:var(--sp-4);}
#note.on{display:flex;}
.empty{padding:var(--sp-5) var(--sp-3);text-align:center;color:var(--text2);}
/* Zdraví */
.zd-ev{display:flex;flex-direction:column;gap:var(--sp-3);}
.zd-e{padding:var(--sp-3);border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg2);}
.zd-et{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:4px;}
.zd-e .xs{margin-top:4px;}
.zd-rut{display:flex;flex-direction:column;gap:var(--sp-2);}
.zd-r{display:grid;grid-template-columns:96px 1fr;gap:var(--sp-3);align-items:start;padding:var(--sp-2) 0;border-bottom:1px solid var(--border);}
.zd-r:last-child{border-bottom:0;}
.zd-h{color:var(--teal);font-size:var(--fs-sm);}
.zd-q{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;}
@media(max-width:760px){.zd-r{grid-template-columns:1fr;gap:2px;}}
.toast{position:fixed;left:50%;bottom:var(--sp-5);transform:translateX(-50%);background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r-md);padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm);z-index:400;opacity:0;pointer-events:none;transition:opacity .2s;}

@media(max-width:760px){.toast{bottom:calc(var(--bnav-h) + env(safe-area-inset-bottom,0px) + var(--sp-3));}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

'use strict';
// ══════════ GARMIN HEALTH — aplikace (vkládá se do garmin-dashboard.html, viz tools/build.py) ══════════
// Data: cloud (Apps Script: window.__GH_CLOUD__ → google.script.run ghGet / ghSync / ghSet / ghJournalSet / ghJournalCfg)
// nebo volitelně lokální server (file:// → http://localhost:8765 /data /settings /journal /sync).
// Tvar dat = buildData_ (Apps Script) = load_data (local/garmin_data.py); `days` (kompaktní dny + aktivity) má jen cloud.

const API = 'http://localhost:8765';
const CLOUD = window.__GH_CLOUD__ || null;
const ST_KEYS = ['garmin_thresholds', 'garmin_vst_zones', 'garmin_hr_zones', 'garmin_bb_zones', 'garmin_resp_zones', 'garmin_ui'];
const STALE_H = 30;

const UI = { trend: 'hrv', range: 30, out: 'hrv', jday: null, fmeal: null, fq: '', fed: null, fnew: '' };

// ── drobnosti ──
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const num = v => (typeof v === 'number' && isFinite(v)) ? v : (v != null && v !== '' && isFinite(+v) ? +v : null);
const fmt = (v, d) => { v = num(v); return v == null ? '—' : v.toLocaleString('cs-CZ', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); };
const sgn = (v, d) => { const p = Math.pow(10, d || 0), r = Math.round(v * p) / p; return r === 0 ? '±0' : (r > 0 ? '+' : '−') + fmt(Math.abs(r), d); };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const vr = a => { const m = avg(a); return a.length > 1 ? a.reduce((s, x) => s + (x - m) * (x - m), 0) / (a.length - 1) : 0; };
const ymd = d => { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); };
const addD = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const TODAY = () => ymd(new Date());
const DOW = ['neděle', 'pondělí', 'úterý', 'středa', 'čtvrtek', 'pátek', 'sobota'];
const MON = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
const dLong = s => { const d = new Date(s + 'T12:00:00'); return DOW[d.getDay()] + ' ' + d.getDate() + '. ' + MON[d.getMonth()]; };
const dShort = s => s ? (+s.slice(8, 10)) + '. ' + (+s.slice(5, 7)) + '.' : '';
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const hm = h => { if (h == null) return '—'; const m = Math.round(h * 60); return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min'; };
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2600); }
function note(msg, kind) {
  const el = $('note'); if (!msg) { el.className = 'card'; el.innerHTML = ''; return; }
  el.className = 'card on'; el.style.borderLeft = '3px solid ' + tok(kind === 'warn' ? '--amber' : '--crit');
  el.innerHTML = '<div class="sm">' + msg + '</div>';
}

// ── nastavení (prahy, zóny, vzhled): v paměti, localStorage = kopie, trvale na Disku (garmin-settings.json) ──
const ST = {};
function stGet(k) { if (k in ST) return ST[k]; try { return localStorage.getItem(k); } catch (e) { return null; } }
function stSet(k, v) { ST[k] = v; try { localStorage.setItem(k, v); } catch (e) {} stQueue(k, v); }
function stDel(k) { ST[k] = null; try { localStorage.removeItem(k); } catch (e) {} stQueue(k, null); }
let stPend = {}, stTimer = null;
function stQueue(k, v) { stPend[k] = v; clearTimeout(stTimer); stTimer = setTimeout(stFlush, 500); }
async function stFlush() {
  const b = stPend; stPend = {}; if (!Object.keys(b).length) return;
  try {
    const r = CLOUD ? await gsRun('ghSet', CLOUD.key, JSON.stringify(b))
      : await (await fetch(`${API}/settings`, { method: 'POST', body: JSON.stringify(b), headers: { 'Content-Type': 'text/plain' } })).json();
    if (!r.ok) throw new Error(r.error || 'neznámá chyba');
  } catch (e) { note('Nastavení se neuložilo na Disk (' + esc(e.message || e) + ') — platí jen v tomto prohlížeči.', 'warn'); }
}
function stApply(s) {
  if (!s || typeof s !== 'object') return;
  ST_KEYS.forEach(k => { if (k in s && s[k] != null) { ST[k] = String(s[k]); try { localStorage.setItem(k, ST[k]); } catch (e) {} } });
  T = loadT();
}
function gsRun(fn, ...a) {
  return new Promise((res, rej) => {
    if (!window.google || !google.script || !google.script.run) return rej(new Error('google.script.run není k dispozici'));
    google.script.run.withSuccessHandler(t => { try { res(typeof t === 'string' ? JSON.parse(t) : t); } catch (e) { rej(e); } })
      .withFailureHandler(e => rej(e instanceof Error ? e : new Error(String(e && e.message || e))))[fn](...a);
  });
}

// ── prahy (Pavlovy, editovatelné v Nastavení) ──
const THRESH_DEF = {

};
function loadT() {
  try { const s = stGet('garmin_thresholds'); if (s) { const p = JSON.parse(s), m = {}; for (const k in THRESH_DEF) m[k] = { ...THRESH_DEF[k], ...(p[k] || {}) }; return m; } } catch (e) {}
  return JSON.parse(JSON.stringify(THRESH_DEF));
}
let T = loadT();
function saveT() { const o = {}; for (const k in T) o[k] = { val: T[k].val }; stSet('garmin_thresholds', JSON.stringify(o)); }

// zóny grafů (stejné klíče jako původní dashboard): z1 / z2 + okno klouzavého průměru
const ZDEF = {
  hrv:  { key: 'garmin_vst_zones',  z1: 26, z2: 30, avgDays: 7, up: true,  l: 'HRV', u: 'ms' },
  rhr:  { key: 'garmin_hr_zones',   z1: 54, z2: 57, avgDays: 7, up: false, l: 'Klidová TF', u: 'bpm' },
  bb:   { key: 'garmin_bb_zones',   z1: 35, z2: 50, avgDays: 7, up: true,  l: 'Body Battery ráno', u: '' },
  resp: { key: 'garmin_resp_zones', z1: 16, z2: 19, avgDays: 7, up: false, l: 'Dýchání', u: 'dech/min' },
};
function zones(m) { const z = ZDEF[m]; if (!z) return null; try { const p = JSON.parse(stGet(z.key) || 'null'); if (p) return { ...z, z1: +p.z1 || z.z1, z2: +p.z2 || z.z2, avgDays: +p.avgDays || z.avgDays }; } catch (e) {} return { ...z }; }
function zoneSave(m, z) { stSet(ZDEF[m].key, JSON.stringify({ z1: z.z1, z2: z.z2, avgDays: z.avgDays })); }
// barva podle zóny: up = vyšší je lepší (HRV, BB), jinak nižší je lepší (TF, dýchání)
function zoneCol(m, v) { const z = zones(m); if (!z || v == null) return tok('--blue'); if (z.up) return v < z.z1 ? tok('--red') : v < z.z2 ? tok('--amber') : tok('--green'); return v <= z.z1 ? tok('--green') : v <= z.z2 ? tok('--amber') : tok('--red'); }

// ── vzhled ──
function uiGet() { try { return JSON.parse(stGet('garmin_ui') || '{}') || {}; } catch (e) { return {}; } }
// garmin_ui se na Disku ukládá nejvýš 10 000 znaků (ghSet) → hlídat tady, nikdy neuložit useknutý JSON
const UI_MAX = 9500;
function uiSet(o) { const j = JSON.stringify(o); if (j.length > UI_MAX) { toast('Neuloženo — data rozhraní by přesáhla ' + UI_MAX + ' znaků'); return false; } stSet('garmin_ui', j); return true; }
function themeSet(t) { document.documentElement.toggleAttribute('data-theme', t === 'graphite'); if (t === 'graphite') document.documentElement.setAttribute('data-theme', 'graphite'); try { localStorage.setItem('gh_theme', t); } catch (e) {} renderAll(); }

// ══════════ DATA ══════════
async function fetchData() {
  if (CLOUD) return take(await gsRun('ghGet', CLOUD.key), 'cloud');
  const r = await fetch(`${API}/data`, { cache: 'no-store' });
  if (!r.ok) throw new Error('Lokální server: HTTP ' + r.status);
  try { const s = await fetch(`${API}/settings`, { cache: 'no-store' }); if (s.ok) { const st = await s.json(); migrateLocal(st); stApply(st); } } catch (e) {}
  let journal = null; try { const j = await (await fetch(`${API}/journal`, { cache: 'no-store' })).json(); if (j.ok) journal = j.journal; } catch (e) {}
  return take({ ok: true, data: await r.json(), journal: journal, at: new Date().toISOString(), ageH: 0 }, 'local');
}
// stará lokální verze měla prahy jen v localStorage prohlížeče → jednorázově na Disk
function migrateLocal(st) { ST_KEYS.forEach(k => { if (!(k in st)) { let v = null; try { v = localStorage.getItem(k); } catch (e) {} if (v != null) stQueue(k, v); } }); }
function take(r, src) {
  stApply(r.settings);
  if (r.journal) { JR = { days: r.journal.days || {}, cfg: r.journal.cfg || {}, food: r.journal.food || {} }; try { mregApply(); } catch (e) {} }
  zdInit(r);   // Zdraví: osobní data z Disku (garmin-zdravi.json), offline chybí
  if (!r.ok || !r.data) throw new Error(r.error || 'Data se nepodařilo načíst');
  if (r.data.error) throw new Error(r.data.error);
  DATA = r.data;
  const se = r.sync && !r.sync.ok ? r.sync.error : (r.sync && r.sync.errs && r.sync.errs.length ? r.sync.errs.join(' · ') : null);
  META = { src: src, at: r.at || DATA.exported_at, ageH: r.ageH || 0, stale: !!r.stale, warn: se ? 'Sync z Garminu: ' + se : (DATA.warn || null), jerr: r.journalErr || null, ierr: r.inboxErr || null };
  buildDays();
  return DATA;
}
// jednotná tabulka dní: cloud dává `days`, lokální režim se skládá z nocí a HRV historie
function buildDays() {
  let rows = Array.isArray(DATA.days) && DATA.days.length ? DATA.days.map(x => ({ ...x, a: x.a || [] })) : null;
  if (!rows) {
    const m = {};
    (DATA.nights || []).forEach(n => { const d = n.date || n.calendar_date; if (!d) return; m[d] = { d: d, sc: num(n.score), sh: num(n.hours), rhr: num(n.hr), bb: num(n.bb), rs: num(n.resp), st: null, stp: null, hrv: num(n.hrv), a: [] }; });
    (DATA.hrv_history || []).forEach(h => { if (!h.date) return; (m[h.date] = m[h.date] || { d: h.date, a: [] }).hrv = num(h.hrv); });
    rows = Object.values(m);
  }
  const nm = {}; (DATA.nights || []).forEach(n => { nm[n.date || n.calendar_date] = n; });
  const hm_ = {}; (DATA.hrv_history || []).forEach(h => { hm_[h.date] = h; });
  rows.forEach(x => { const n = nm[x.d]; if (n) { x.deep = num(n.deep_min); x.rem = num(n.rem_min); x.light = num(n.light_min); x.awake = num(n.awake_min); x.bt = num(n.bt); x.wt = num(n.wt); if (x.rs == null) x.rsN = num(n.resp); else x.rsN = num(n.resp); }
    const h = hm_[x.d]; if (h) { x.bl = num(h.baseline_low); x.bu = num(h.baseline_upper); } });
  DAYS = rows.sort((a, b) => a.d < b.d ? -1 : 1); BYD = {}; DAYS.forEach(x => { BYD[x.d] = x; });
}

async function doSync() {
  const b = $('syncBtn'); b.disabled = true; b.classList.add('loading'); b.querySelector('span').textContent = 'Stahuji…';
  try {
    if (CLOUD) take(await gsRun('ghSync', CLOUD.key), 'cloud');
    else { await fetch(`${API}/sync`, { cache: 'no-store' }); await new Promise(r => setTimeout(r, 28000)); await fetchData(); }
    dataNote(); renderAll(); toast('Data z Garminu aktualizována');
  } catch (e) { note(esc(e.message || e), 'err'); }
  finally { b.disabled = false; b.classList.remove('loading'); b.querySelector('span').textContent = 'Sync'; }
}
function dataNote() {
  if (META && META.stale) note(`Data jsou stará ${Math.round(META.ageH)} h — sync z Garminu neprobíhá. Zkontroluj synchronizaci hodinek s telefonem a klíč Personal API (vyprší nejvýš za rok).`, 'warn');

    return `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0,1 ${x2.toFixed(1)},${y2.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w || sw}"/>`; };

    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`; };

  s += tick(a14, tok('--purple'), r + sw / 2 + 9, r + sw / 2 + 2) + tick(a7, tok('--blue'), r + sw / 2 + 8, r + sw / 2 + 1);
  if (!nd) { const [nx, ny] = pt(value, r - 6); s += `<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${tok('--text')}" stroke-width="2.2" stroke-linecap="round"/>`; }

// ── Krátce: co se zlepšuje / zhoršuje (tento týden vs minulý), série dní a vliv včerejška z deníku — jen z čísel, žádné domýšlení ──
const BRIEF_M = [
  { k: 'hrv', l: 'HRV', u: 'ms', b: 1, thr: 2, d: 0 }, { k: 'rhr', l: 'klidová TF', u: 'bpm', b: -1, thr: 1.5, d: 1 },

function briefOf() {
  const ref = (DATA && DATA.date) || TODAY(), win = (k, from, n) => { const v = []; for (let i = from; i < from + n; i++) { const x = BYD[addD(ref, -i)]; if (x && num(x[k]) != null) v.push(num(x[k])); } return v; };

  const out = [];
  if (up.length) out.push({ k: 'up', h: 'Zlepšuje se', t: up.slice(0, 3).map(item).join(', ') });
  if (down.length) out.push({ k: 'down', h: 'Zhoršuje se', t: down.slice(0, 3).map(item).join(', ') });
  if ((up.length || down.length) && same.length) out.push({ k: 'eq', h: 'Beze změny', t: same.map(r => esc(r.m.l)).join(', ') });

  const streak = (k, dir) => { let n = 0; for (let i = 0; i < 10; i++) { const a = BYD[addD(ref, -i)], b = BYD[addD(ref, -i - 1)]; if (!a || !b || num(a[k]) == null || num(b[k]) == null || (num(a[k]) - num(b[k])) * dir <= 0) break; n++; } return n; };

  else if (sR >= 3) out.push({ k: 'down', h: 'Série', t: `Klidová TF roste <b>${sR}. ráno po sobě</b> — může jít o únavu nebo nástup nemoci.` });
  else if (sHu >= 3) out.push({ k: 'up', h: 'Série', t: `HRV roste <b>${sHu}. ráno po sobě</b>.` });

// ── Stav regenerace podle trendu HRV (I-002, princip HRV4Training): 7denní Ø HRV proti normálnímu pásmu (Ø 60 dní před tím ± 0,5 SD),
// kolísání HRV (CV 7 dní) proti obvyklému a klidová TF 7 dní proti Ø 60 dní. Bez vyplňování, orientační. ──
function recovOf() {

  const cvs = []; for (let i = 7; i <= 60; i++) { const w = vals('hrv', i, 7); if (w.length >= 5) cvs.push(cv(w)); }
  const cv7 = cv(h7), cvB = cvs.length ? avg(cvs) : null, r7 = vals('rhr', 0, 7), rb = vals('rhr', 7, 60);
  const dR = r7.length >= 4 && rb.length >= 20 ? avg(r7) - avg(rb) : null, cvHi = cvB != null && cv7 > cvB * 1.5, cvUp = cvB != null && cv7 > cvB * 1.25;
  let k, l, t;

  else if (a7 < lo) { k = 'amber'; l = 'Riziko přetížení'; t = 'Týdenní Ø HRV kleslo pod tvůj normál. Zvaž lehčí dny, dokud se nevrátí.'; }
  else if (cvHi) { k = 'amber'; l = 'Nestabilní'; t = 'HRV ze dne na den výrazně víc kolísá než obvykle — tělo se se zátěží zatím vyrovnává hůř.'; }
  else if (cvB != null && cv7 <= cvB) { k = 'good'; l = 'Zvládáš zátěž'; t = 'HRV v normálu a stabilní — tělo se se zátěží vyrovnává dobře.'; }

    <div class="sm" style="margin-bottom:var(--sp-3)">${esc(r.t)}</div>
    <div class="stats">${stat('HRV Ø 7 dní', fmt(r.a7) + ' ms')}${stat('Tvůj normál', fmt(r.lo) + '–' + fmt(r.hi) + ' ms')}${stat('Kolísání (CV)', fmt(r.cv7, 1) + ' %' + (r.cvB != null ? ' · obvykle ' + fmt(r.cvB, 1) : ''))}${r.dR != null ? stat('Klidová TF vs normál', sgn(r.dR, 1) + ' bpm') : ''}</div>
    <div class="xs muted" style="margin-top:var(--sp-2)">Normál = Ø HRV ${r.n} dní před tímto týdnem ± 0,5 SD. Princip podle HRV4Training, orientační.</div></div>`;

// ── Spánkový dluh za 14 nocí (I-009, princip RISE): potřeba = nastavení, jinak Ø délky nocí se skóre ≥ 80 za 90 dní (7–9 h, bez dat 8 h);
// dluh = Σ váha × (potřeba − spánek) za 14 nocí, poslední noc váží nejvíc (14/7,5 … 1/7,5, Σ vah = 14), dluh nejméně 0. Cíl pod 5 h. ──
function sleepNeed() {
  const set = num(T.sleep_need && T.sleep_need.val); if (set && set >= 4 && set <= 12) return { h: set, auto: false };
  const ref = (DATA && DATA.date) || TODAY(), g = [];
  for (let i = 0; i < 90; i++) { const x = BYD[addD(ref, -i)]; if (x && num(x.sh) != null && num(x.sc) >= 80) g.push(num(x.sh)); }
  return { h: g.length >= 10 ? Math.max(7, Math.min(9, avg(g))) : 8, auto: true, n: g.length };
}

}

  const k = d < 5 ? 'good' : d < 10 ? 'amber' : 'crit', l = d < 5 ? 'v cíli' : d < 10 ? 'vyšší' : 'vysoký';
  return { d, w, dd, k, l, need: N };
}
function debtHtml() {
  const r = debtOf(); if (!r) return '';

  return `<div class="card debt"><div class="card-h"><div class="card-t">Spánkový dluh</div>${pill(r.l, r.k)}</div>
    <div class="kpi-v">${hm(r.d)}</div><div class="sm t2" style="margin:var(--sp-2) 0">${esc(tr)} Cíl je pod 5 h.</div>

}

// ── Ranní signál nemoci (I-010, princip Oura Symptom Radar): poslední ráno proti Ø 30 předchozích dní (≥ 14 hodnot).
// Odchylka: dýchání v noci z ≥ 1,5 SD a ≥ +0,7 dechu/min, klidová TF z ≥ 1,5 a ≥ +3 bpm, HRV z ≤ −1,5 a ≥ 10 % pod Ø.
// 2 odchylky = drobné známky, 3 (nebo 2 dvě rána po sobě) = výrazné. Orientační, ne diagnóza. ──
function illDevs(ref) {
  const x = BYD[ref]; if (!x) return null;
  const M = [['rs', 'Dýchání v noci', 'dechu/min', 1, 0.7, 1], ['rhr', 'Klidová TF', 'bpm', 1, 3, 0], ['hrv', 'HRV', 'ms', -1, 0.1, 0]];
  const val = (y, k) => y ? (k === 'rs' ? num(y.rsN ?? y.rs) : num(y[k])) : null, out = [];
  let have = 0;
  M.forEach(([k, l, u, dir, minD, dec]) => { const v = val(x, k); if (v == null) return; const b = []; for (let i = 1; i <= 30; i++) { const y = val(BYD[addD(ref, -i)], k); if (y != null) b.push(y); }
    if (b.length < 14) return; have++; const m = avg(b), sd = Math.sqrt(vr(b)) || 1e-9, z = (v - m) / sd, d = v - m;
    const hit = dir > 0 ? z >= 1.5 && d >= minD : z <= -1.5 && -d >= minD * m;
    if (hit) out.push({ k, l, u, v, m, d, dec }); });

}

  const ref = (DATA && DATA.date) || TODAY(), a = illDevs(ref); if (!a || a.length < 2) return null;
  const p = illDevs(addD(ref, -1)), strong = a.length >= 3 || (p && p.length >= 2);
  return { lvl: strong ? 'crit' : 'warn', devs: a, two: !!(p && p.length >= 2) };
}

// ── Ideální čas usínání (I-003, princip Oura Bedtime Guidance): noci za 60 dní s časem usnutí (bt, z Apps Scriptu), ≥ 14 nocí;
// nejlepší třetina podle skóre spánku (při shodě nižší klidová TF) → okno = 25.–75. percentil jejich usnutí, nejméně 30 min kolem mediánu. ──

const clk = m => { m = Math.round(((m % 1440) + 1440) % 1440); return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); };
function bedOf() {
  const ref = (DATA && DATA.date) || TODAY(), all = [];
  for (let i = 0; i < 60; i++) { const x = BYD[addD(ref, -i)]; if (x && num(x.bt) != null && num(x.sc) != null) all.push({ d: x.d, b: btNorm(num(x.bt)), sc: num(x.sc), rhr: num(x.rhr) }); }

    <div class="row-add"><select id="ntreg" aria-label="Štítek">${TAGS.flatMap(g => g.items).concat((JR.cfg.tags || []).map(c => ({ id: c.id, l: c.l }))).filter(t => !tagReg(t.id)).map(t => `<option value="${esc(t.id)}">${esc(t.l)}</option>`).join('')}</select><button class="btn" id="atreg">Přidat</button></div></div>
  <div class="card"><div class="card-h"><div class="card-t">Pravidelná jídla</div><span class="card-s">doplněná každý pracovní den sama</span></div>
    <div class="sup-ed" id="lmreg">${mregList().map(r => `<div class="sup-row"><span class="sup-n">${esc((MEAL_S.find(x => x[0] === r.s) || [0, r.s])[1])}</span><span class="sm t2">od ${esc(dShort(r.from))} · ${(r.wd || [1, 2, 3, 4, 5]).length === 5 ? 'Po–Pá' : (r.wd || []).length + ' dní v týdnu'} · ${r.it.length ? r.it.length + ' položek' : 'bez položek — přidej níže'}</span><input class="sup-h" data-mh="${esc(r.id)}" value="${esc(r.h || '')}" placeholder="čas (09:45)" maxlength="5" aria-label="Čas pravidelného jídla"><button class="x" data-mm="${esc(r.id)}" aria-label="Zrušit pravidelné jídlo">✕</button></div><div class="mreg-it">${r.it.map((i, n) => { const f = (JR.food || {})[i.f]; return `<div class="sup-row mreg-row"><span class="sup-n sm">${esc(f ? f.l : i.f)}${f && f.k != null ? ` <small class="muted">${fmt(Math.round(f.k * i.g / 100))} kcal</small>` : ''}</span><input class="sup-q" type="number" min="0" step="1" data-mig="${esc(r.id)}:${n}" value="${esc(i.g)}" aria-label="Gramy"><span class="sm t2">g</span><button class="x" data-mid="${esc(r.id)}:${n}" aria-label="Odebrat položku">✕</button></div>`; }).join('')}<div class="sup-row mreg-row"><input class="sup-n" list="mregdl" data-mia="${esc(r.id)}" placeholder="+ přidat jídlo z databáze" aria-label="Přidat položku"><input class="sup-q" type="number" min="1" step="1" data-mig2="${esc(r.id)}" placeholder="g" aria-label="Gramy nové položky"><span class="sm t2">g</span><button class="btn" data-miadd="${esc(r.id)}">Přidat</button></div></div>`).join('') || '<span class="muted sm">Zatím žádná — v záložce Jídlo u jídla „Opakovat Po–Pá“.</span>'}<datalist id="mregdl">${Object.keys(JR.food || {}).map(id => `<option value="${esc(JR.food[id].l)}">`).join('')}</datalist><div class="sup-row mreg-new"><select class="sup-u" id="mrnk" aria-label="Druh jídla">${MEAL_S.map(x => `<option value="${x[0]}">${x[1]}</option>`).join('')}</select><input class="sup-h" id="mrnh" placeholder="čas (12:30)" maxlength="5" aria-label="Čas nového pravidelného jídla"><button class="btn" id="mrnadd">+ Nové pravidelné jídlo</button></div></div></div>
  <div class="card"><div class="card-h"><div class="card-t">Prahové hodnoty</div><button class="btn btn-ghost" id="treset">Obnovit výchozí</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Metrika</th><th>Práh</th><th>Stav</th><th>Akce</th></tr></thead><tbody>
    ${Object.entries(T).map(([k, r]) => `<tr><td>${esc(r.label)}</td><td><input type="number" step="any" data-th="${k}" value="${r.val}"> <span class="xs muted">${esc(r.unit)}</span></td>
      <td>${pill(r.badge, r.stav === 'ok' ? 'ok' : r.stav === 'warn' ? 'amber' : 'crit')}</td><td class="t2">${esc(r.akce)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="grid g-2">
    <div class="card"><div class="card-h"><div class="card-t">Vzhled</div></div>
      <div class="seg" id="theme"><button data-v="slate" class="${theme === 'slate' ? 'on' : ''}">Břidlice</button><button data-v="graphite" class="${theme === 'graphite' ? 'on' : ''}">Grafit</button></div></div>
    <div class="card"><div class="card-h"><div class="card-t">Data</div></div>
      <div class="sm t2">Zdroj: ${META.src === 'cloud' ? 'Garmin Personal API (Apps Script, ~každé 2 h)' : 'lokální server na PC'}<br>Poslední sync: ${esc(ageText())}<br>Dny v datech: ${DAYS.length} · deník: ${Object.keys(JR.days).length} dní</div>
      <div style="margin-top:var(--sp-3)"><button class="btn" id="nsync">Stáhnout teď</button></div></div>
  </div>`;
  const addTo = (key, inp) => { const l = $(inp).value.trim(); if (!l) return; const id = l.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 30) || ('x' + Date.now());
    const arr = JR.cfg[key] = JR.cfg[key] || []; if (!arr.some(x => x.id === id)) arr.push({ id: id, l: l.slice(0, 40) }); jCfgSave(); renderNast(); };
  $('asup').onclick = () => addTo('sup', 'nsup'); $('atag').onclick = () => addTo('tags', 'ntag');
  $('nsup').onkeydown = e => { if (e.key === 'Enter') addTo('sup', 'nsup'); }; $('ntag').onkeydown = e => { if (e.key === 'Enter') addTo('tags', 'ntag'); };
  $('lsup').querySelectorAll('[data-l]').forEach(i => i.onchange = () => { const s = supCfg(i.dataset.l), v = i.value.trim().slice(0, 40); if (!s) return; if (!v) { i.value = s.l; return; } s.l = v; jCfgSave(); });
  const supQSave = (id, el) => { const s = supCfg(id), L = $('lsup'), ni = L.querySelector(`[data-qn="${id}"]`), ui = L.querySelector(`[data-qu="${id}"]`); if (!s) return; const n = ni.value.trim().replace('.', ',');
    if (n && !/^\d+(,\d+)?$/.test(n)) { ni.value = qParse(s.q).n; return; } const q = qJoin(n, ui.value); if (q) s.q = q.slice(0, Q_MAX); else delete s.q; jCfgSave(); };
  $('lsup').querySelectorAll('[data-qn],[data-qu]').forEach(i => i.onchange = () => supQSave(i.dataset.qn || i.dataset.qu, i));
  $('lsup').querySelectorAll('[data-reg]').forEach(c => c.onchange = () => { const s = supCfg(c.dataset.reg); if (!s) return; if (c.checked) s.reg = { from: TODAY(), h: '' }; else delete s.reg; jCfgSave(); renderNast(); });
  $('lsup').querySelectorAll('[data-regh]').forEach(i => i.onchange = () => { const s = supCfg(i.dataset.regh); if (s && s.reg) { s.reg.h = i.value.trim().slice(0, 40); jCfgSave(); } });
  $('atreg').onclick = () => { const id = $('ntreg').value; if (!id) return; JR.cfg.treg = JR.cfg.treg || {}; JR.cfg.treg[id] = { from: TODAY(), h: '' }; jCfgSave(); renderNast(); };
  $('ltreg').querySelectorAll('[data-th2]').forEach(i => i.onchange = () => { const r = tagReg(i.dataset.th2); if (r) { r.h = i.value.trim().slice(0, 40); jCfgSave(); } });
  $('ltreg').querySelectorAll('[data-trn]').forEach(i => i.onchange = () => { const r = tagReg(i.dataset.trn), n = parseInt(i.value, 10); if (!r) return; if (n > 0 && n <= 999) r.n = n; else i.value = r.n || tagById(i.dataset.trn).c; jCfgSave(); });
  $('ltreg').querySelectorAll('[data-trq]').forEach(i => i.onchange = () => { const r = tagReg(i.dataset.trq); if (!r) return; const v = i.value.trim().slice(0, 20); if (v) r.q = v; else delete r.q; jCfgSave(); });
  $('ltreg').querySelectorAll('[data-trm]').forEach(b => b.onclick = () => { delete JR.cfg.treg[b.dataset.trm]; if (!Object.keys(JR.cfg.treg).length) delete JR.cfg.treg; jCfgSave(); renderNast(); });
  $('lmreg').querySelectorAll('[data-mh]').forEach(i => i.onchange = () => { const r = (JR.cfg.mreg || []).find(x => x.id === i.dataset.mh); if (r && /^\d{2}:\d{2}$/.test(i.value.trim())) { r.h = i.value.trim(); jCfgSave(); } else i.value = r ? r.h || '' : ''; });
  $('mrnadd').onclick = () => { const s = $('mrnk').value, h = $('mrnh').value.trim();
    if (h && !/^\d{1,2}:\d{2}$/.test(h)) { toast('Čas zadej jako 12:30.'); return; }
    if (s !== 'sv' && mregList().some(x => x.s === s)) { toast('Toto jídlo už pravidelné je — přidej položky do něj.'); return; }
    (JR.cfg.mreg = JR.cfg.mreg || []).push({ id: 'm' + Date.now().toString(36), s, h: h ? h.padStart(5, '0') : '', from: TODAY(), wd: [1, 2, 3, 4, 5], it: [] }); jCfgSave(); renderNast(); };
  const mrFind = id => (JR.cfg.mreg || []).find(x => x.id === id);
  $('lmreg').querySelectorAll('[data-mig]').forEach(i => i.onchange = () => { const [id, n] = i.dataset.mig.split(':'), r = mrFind(id), g = Number(i.value); if (r && r.it[+n] && g > 0) { r.it[+n].g = g; jCfgSave(); renderNast(); } else renderNast(); });
  $('lmreg').querySelectorAll('[data-mid]').forEach(b => b.onclick = () => { const [id, n] = b.dataset.mid.split(':'), r = mrFind(id); if (!r) return; r.it.splice(+n, 1); jCfgSave(); renderNast(); });
  $('lmreg').querySelectorAll('[data-miadd]').forEach(b => b.onclick = () => { const id = b.dataset.miadd, r = mrFind(id), nm = $('lmreg').querySelector(`[data-mia="${id}"]`).value.trim().toLowerCase(), g = Number($('lmreg').querySelector(`[data-mig2="${id}"]`).value); const fid = Object.keys(JR.food || {}).find(k => JR.food[k].l.toLowerCase() === nm); if (!r || !fid || !(g > 0)) { toast('Vyber jídlo z databáze a zadej gramy.'); return; } r.it.push({ f: fid, g }); jCfgSave(); renderNast(); });
  $('lmreg').querySelectorAll('[data-mm]').forEach(b => b.onclick = () => { JR.cfg.mreg = (JR.cfg.mreg || []).filter(x => x.id !== b.dataset.mm); if (!JR.cfg.mreg.length) delete JR.cfg.mreg; jCfgSave(); renderNast(); });
  [['lsup', 'sup'], ['ltag', 'tags']].forEach(([el, key]) => $(el).querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { JR.cfg[key] = (JR.cfg[key] || []).filter(x => x.id !== b.dataset.rm); jCfgSave(); renderNast(); }));
  $('p-nast').querySelectorAll('[data-th]').forEach(i => i.addEventListener('change', () => { const v = parseFloat(i.value); if (isNaN(v)) { i.value = T[i.dataset.th].val; return; } T[i.dataset.th].val = v; saveT(); toast('Práh uložen'); }));
  $('treset').onclick = () => { stDel('garmin_thresholds'); T = loadT(); renderNast(); toast('Výchozí prahy obnoveny'); };
  $('theme').querySelectorAll('button').forEach(b => b.onclick = () => themeSet(b.dataset.v));
  $('nsync').onclick = doSync;
  $('p-nast').querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}

// ══════════ START ══════════
(async function init() {
  navInit();
  $('syncBtn').addEventListener('click', doSync);
  const h = (location.hash || '').slice(1); let last = ''; try { last = localStorage.getItem('gh_page') || ''; } catch (e) {}
  go(NAV.some(n => n[0] === h) ? h : NAV.some(n => n[0] === last) ? last : 'dnes');
  try { await fetchData(); dataNote(); renderAll(); }
  catch (e) {
    note(CLOUD ? esc(e.message || e) : '<b>Lokální server neběží.</b> Hlavní dashboard běží v cloudu (adresa z Apps Scriptu). Offline: dvojklik na <b>Start Garmin Dashboard</b> na ploše.', 'err');
    $('p-' + PAGE).innerHTML = '<div class="card empty">Data nejsou k dispozici.</div>';
  }
})();

</script>
</body>
</html>
